<div id="admin-budget-container" class="animate-in fade-in duration-700 p-6">
  <div class="mb-8 flex flex-col md:flex-row md:items-start md:justify-between gap-4">
    <div>
      <span class="text-[#1565C0] font-black uppercase tracking-[0.2em] text-xs">Vista Administrativa</span>
      <h2 class="text-3xl font-black tracking-tighter text-on-surface mt-1">Estado de Presupuesto</h2>
    </div>
    <div class="flex gap-3 flex-wrap">
      <!-- Filtro mes -->
      <select id="adminBudgetMonthPicker" onchange="refreshAdminBudget()" class="bg-white border border-blue-100 rounded-xl px-4 py-3 font-bold text-sm text-[#1565C0] shadow-sm focus:ring-primary min-w-[150px]">
        <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
        <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
        <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
        <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
      </select>
      <!-- Filtro país -->
      <select id="adminBudgetCountry" onchange="filterAdminBudgetByCountry()" class="bg-white border border-blue-100 rounded-xl px-4 py-3 font-bold text-sm text-[#1565C0] shadow-sm focus:ring-primary min-w-[180px]">
        <option value="GLOBAL">🌍 GLOBAL</option>
        <option value="Costa Rica">🇨🇷 Costa Rica</option>
        <option value="Curacao">🇨🇼 Curacao</option>
        <option value="Dominican Republic">🇩🇴 Dominican Rep.</option>
        <option value="El Salvador">🇸🇻 El Salvador</option>
        <option value="Guatemala">🇬🇹 Guatemala</option>
        <option value="Panamá">🇵🇦 Panamá</option>
        <option value="Venezuela">🇻🇪 Venezuela</option>
      </select>
      <!-- Tienda específica -->
      <select id="adminStoreSelector" onchange="window.refreshAdminBudget()" class="bg-white border border-blue-100 rounded-xl px-4 py-3 font-bold text-sm text-zinc-800 shadow-sm focus:ring-primary min-w-[200px]">
        <option value="GLOBAL">🌎 VISTA GLOBAL</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- MTD Admin -->
    <div class="bg-[#0D47A1] rounded-[2rem] p-8 border border-blue-800 shadow-2xl relative overflow-hidden">
      <div class="absolute top-0 right-0 w-28 h-28 bg-white/5 rounded-full -translate-y-6 translate-x-6"></div>
      <span class="text-[10px] font-black text-blue-300 uppercase tracking-[0.3em]">Month To Date (MTD)</span>
      <div class="mt-4 flex justify-between items-end">
        <h3 id="admin-mtd-actual" class="text-4xl font-black text-white tracking-tighter">$0</h3>
        <span id="admin-mtd-pct" class="text-emerald-400 font-black text-xl">0%</span>
      </div>
      <div class="mt-6 space-y-2">
        <div class="flex justify-between text-[10px] font-bold text-blue-300 uppercase">
          <span>Progreso vs Meta Mensual</span>
          <span id="admin-mtd-target">Meta: $0</span>
        </div>
        <div class="w-full bg-blue-900 h-3 rounded-full overflow-hidden">
          <div id="admin-mtd-bar" class="h-full bg-blue-300 transition-all duration-1000" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- YTD Admin -->
    <div class="bg-blue-50 rounded-[2rem] p-8 border border-blue-100 shadow-sm">
      <span class="text-[10px] font-black text-blue-400 uppercase tracking-[0.3em]">Year To Date (YTD)</span>
      <div class="mt-4 flex justify-between items-end">
        <h3 id="admin-ytd-actual" class="text-4xl font-black text-zinc-900 tracking-tighter">$0</h3>
        <span id="admin-ytd-pct" class="text-zinc-900 font-black text-xl">0%</span>
      </div>
      <div class="mt-6 space-y-2">
        <div class="flex justify-between text-[10px] font-bold text-zinc-400 uppercase">
          <span>Progreso Anual</span>
          <span id="admin-ytd-target">Meta: $0</span>
        </div>
        <div class="w-full bg-blue-100 h-3 rounded-full overflow-hidden">
          <div id="admin-ytd-bar" class="h-full bg-[#1565C0] transition-all duration-1000" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Desglose por tienda -->
  <div id="store-budget-breakdown" class="mt-10 hidden">
    <div class="flex items-center gap-3 mb-5">
      <div class="h-6 w-1 bg-primary rounded-full"></div>
      <h3 class="text-sm font-black uppercase tracking-tight text-zinc-800">Desglose por Tienda — MTD</h3>
    </div>
    <div class="bg-white rounded-[2rem] border border-blue-100 shadow-sm overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-[#0D47A1] text-white text-[9px] font-black uppercase tracking-widest">
            <th class="px-6 py-4 text-left">Tienda</th>
            <th class="px-6 py-4 text-center">País</th>
            <th class="px-6 py-4 text-right">Venta MTD</th>
            <th class="px-6 py-4 text-right">Meta MTD</th>
            <th class="px-6 py-4 text-right">% Cumpl.</th>
          </tr>
        </thead>
        <tbody id="store-budget-tbody" class="divide-y divide-blue-50 text-xs font-bold text-zinc-700">
        </tbody>
      </table>
    </div>
  </div>

<script>
function filterAdminBudgetByCountry() {
  const country = document.getElementById('adminBudgetCountry').value;
  const storeSelector = document.getElementById('adminStoreSelector');
  const rows = document.querySelectorAll('#store-budget-tbody tr');

  rows.forEach(row => {
    if (country === 'GLOBAL') {
      row.style.display = '';
    } else {
      const rowCountry = row.getAttribute('data-country') || '';
      row.style.display = rowCountry === country ? '' : 'none';
    }
  });

  // Reset store selector to GLOBAL when filtering by country
  if (storeSelector) storeSelector.value = 'GLOBAL';
}
</script>
</div>
