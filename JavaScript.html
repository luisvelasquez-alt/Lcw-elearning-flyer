<script>
// ─── SECUENCIA DE FETCH (evita respuestas obsoletas) ─────────────────────────
let _entryFetchSeq  = 0;
let _weeklyFetchSeq = 0;

// ─── MAPA DE PAÍSES ───────────────────────────────────────────────────────────
const LCW_COUNTRY_MAP = {
  'CR01': 'Costa Rica',
  'CW01': 'Curacao',
  'DO01': 'Dominican Republic', 'DO02': 'Dominican Republic',
  'SV01': 'El Salvador',
  'GT01': 'Guatemala',
  'PA01': 'Panamá', 'PA02': 'Panamá',
  'VE01': 'Venezuela', 'VE02': 'Venezuela', 'VE03': 'Venezuela',
  'VE04': 'Venezuela', 'VE05': 'Venezuela', 'VE06': 'Venezuela', 'VE100': 'Venezuela'
};

const COUNTRY_FLAGS = {
  'Costa Rica': '🇨🇷', 'Curacao': '🇨🇼', 'Dominican Republic': '🇩🇴',
  'El Salvador': '🇸🇻', 'Guatemala': '🇬🇹', 'Panamá': '🇵🇦', 'Venezuela': '🇻🇪'
};

const LCW_COUNTRY_ALIASES = {
  'COSTA RICA': 'Costa Rica',
  'CURACAO': 'Curacao',
  'CURAZAO': 'Curacao',
  'DOMINICAN REPUBLIC': 'Dominican Republic',
  'REPUBLICA DOMINICANA': 'Dominican Republic',
  'REPÚBLICA DOMINICANA': 'Dominican Republic',
  'EL SALVADOR': 'El Salvador',
  'GUATEMALA': 'Guatemala',
  'PANAMA': 'Panamá',
  'PANAMÁ': 'Panamá',
  'VENEZUELA': 'Venezuela'
};

function normalizeCountryName(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  const upper = raw.toUpperCase();
  if (LCW_COUNTRY_ALIASES[upper] || LCW_COUNTRY_MAP[upper]) return LCW_COUNTRY_ALIASES[upper] || LCW_COUNTRY_MAP[upper];
  if (/\bVE\b|VENEZUELA/.test(upper)) return 'Venezuela';
  if (/\bPA\b|PANAMA|PANAMÁ/.test(upper)) return 'Panamá';
  if (/\bCR\b|COSTA RICA/.test(upper)) return 'Costa Rica';
  if (/\bCW\b|CURACAO|CURAZAO/.test(upper)) return 'Curacao';
  if (/\bDO\b|DOMINICAN|DOMINICANA/.test(upper)) return 'Dominican Republic';
  if (/\bSV\b|EL SALVADOR/.test(upper)) return 'El Salvador';
  if (/\bGT\b|GUATEMALA/.test(upper)) return 'Guatemala';
  return raw;
}

function getRetailCountry() {
  return normalizeCountryName(sessionStorage.getItem('userCountry') || '');
}

function getStoreCountry(storeName) {
  return normalizeCountryName(LCW_COUNTRY_MAP[String(storeName || '').trim().toUpperCase()] || '');
}

function isRetailStoreAllowed(storeName) {
  const role = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();
  if (role !== 'RETAIL') return true;
  return getStoreCountry(storeName) === getRetailCountry();
}

function scopeStoresForCurrentUser(stores) {
  const list = Array.isArray(stores) ? stores : [];
  const role = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();
  return role === 'RETAIL' ? list.filter(isRetailStoreAllowed) : list;
}

function loadStoresForCurrentUser(handler) {
  const role = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();
  const wrappedHandler = stores => handler(scopeStoresForCurrentUser(stores));
  if (role === 'RETAIL') {
    google.script.run.withSuccessHandler(wrappedHandler).getStoreNamesByCountry(getRetailCountry());
  } else {
    google.script.run.withSuccessHandler(wrappedHandler).getActiveStoreNames();
  }
}

// ─── NAVEGADOR GLOBAL ─────────────────────────────────────────────────────────
function loadScreen(pageName) {
  const container  = document.getElementById('app-content');
  const header     = document.getElementById('main-header');
  const mobileNav  = document.getElementById('mobile-nav');
  const role       = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();

  closeMobileMoreMenu();
  container.style.opacity = '0.3';

  let targetPage = pageName;
  if (pageName === 'Budget' && role === 'ADMIN') targetPage = 'AdminBudget';

  google.script.run.withSuccessHandler(function(html) {
    container.innerHTML = html;
    container.style.opacity = '1';

    if (pageName === 'Login') {
      header.style.display  = 'none';
      mobileNav.style.display = 'none';
      setTimeout(() => { if (typeof initLogin === 'function') initLogin(); }, 100);
    } else {
      header.style.display  = 'block';
      mobileNav.style.display = 'flex';
      const store = sessionStorage.getItem('activeStore');
      if (store && document.getElementById('navStoreName'))
        document.getElementById('navStoreName').innerText = store;

    }

    if (targetPage === 'Budget'       && typeof initBudget       === 'function') initBudget();
    if (targetPage === 'AdminBudget'  && typeof initAdminBudget  === 'function') initAdminBudget();
    if (pageName   === 'Entry'        && typeof initEntry        === 'function') initEntry();
    if (pageName   === 'Analysis'     && typeof initAnalysis     === 'function') initAnalysis();
    if (pageName   === 'Admin'        && typeof initAdmin        === 'function') initAdmin();
    if (pageName   === 'Comparativo'  && typeof initComparativo  === 'function') initComparativo();
    if (pageName   === 'Rendimiento'  && typeof initFullness     === 'function') initFullness();
    if (pageName   === 'Despachos'    && typeof initDespachos    === 'function') initDespachos();
    if (pageName   === 'Elearnings'   && typeof initRendimiento  === 'function') initRendimiento();
    if (pageName   === 'RetailStore'  && typeof initRetailStore  === 'function') initRetailStore();
  }).getHtmlContent(targetPage);
}

function toggleMobileMoreMenu(event) {
  if (event) event.stopPropagation();
  const menu = document.getElementById('mobile-more-menu');
  const button = document.getElementById('mobile-more-button');
  if (!menu) return;
  const isOpen = !menu.classList.contains('hidden');
  menu.classList.toggle('hidden', isOpen);
  if (button) button.setAttribute('aria-expanded', String(!isOpen));
}

function closeMobileMoreMenu() {
  const menu = document.getElementById('mobile-more-menu');
  const button = document.getElementById('mobile-more-button');
  if (menu) menu.classList.add('hidden');
  if (button) button.setAttribute('aria-expanded', 'false');
}

document.addEventListener('click', function(event) {
  const mobileNav = document.getElementById('mobile-nav');
  const menu = document.getElementById('mobile-more-menu');
  if (!mobileNav || !menu || menu.classList.contains('hidden')) return;
  if (!mobileNav.contains(event.target)) closeMobileMoreMenu();
});

function openManual() {
  closeMobileMoreMenu();
  google.script.run.withSuccessHandler(function(html) {
    const blob = new Blob([html], { type: 'text/html; charset=utf-8' });
    window.open(URL.createObjectURL(blob), '_blank');
  }).getManualHtml();
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function initLogin() {
  const select = document.getElementById('storeSelect');
  if (!select) return;
  select.innerHTML = '<option value="" disabled selected>Cargando ubicaciones...</option>';
  google.script.run.withSuccessHandler(function(stores) {
    if (stores && stores.length > 0) {
      select.innerHTML = '<option value="" disabled selected>Seleccione Ubicación</option>';
      stores.forEach(name => {
        const opt = document.createElement('option');
        opt.value = opt.text = name;
        select.appendChild(opt);
      });
    } else {
      select.innerHTML = '<option value="" disabled>No se encontraron tiendas</option>';
    }
  }).getLoginStoreNames();
}

function handleLogin() {
  const store = document.getElementById('storeSelect').value;
  const pass  = document.getElementById('passwordInput').value;
  const btn   = document.getElementById('loginBtn');
  if (!store || !pass) { alert('⚠️ Por favor, selecciona una tienda e ingresa la contraseña.'); return; }
  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span> VERIFICANDO...';
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        const role = String(res.role || '').trim().toUpperCase();
        sessionStorage.setItem('activeStore', res.store);
        sessionStorage.setItem('userRole', role);
        if (role === 'RETAIL') sessionStorage.setItem('userCountry', normalizeCountryName(res.country || res.store));
        loadScreen((role === 'ADMIN' || role === 'RETAIL') ? 'Admin' : 'Entry');
      } else {
        alert('❌ Error: ' + res.message);
        btn.disabled = false;
        btn.innerHTML = 'AUTENTICAR SISTEMA <span class="material-symbols-outlined text-sm">verified_user</span>';
      }
    })
    .withFailureHandler(function(err) {
      alert('Error crítico de conexión.');
      btn.disabled = false;
      btn.innerHTML = 'AUTENTICAR SISTEMA';
    })
    .authenticateUser(store, pass);
}

function handleLogout() { sessionStorage.clear(); loadScreen('Login'); }

// ─── ENTRY ────────────────────────────────────────────────────────────────────
function initEntry() {
  const store = sessionStorage.getItem('activeStore');
  const role  = (sessionStorage.getItem('userRole') || '').toUpperCase();
  if (!store) { loadScreen('Login'); return; }

  const titulo = document.getElementById('displayStoreName');
  if (titulo) titulo.innerText = store;

  const dateInput = document.getElementById('inputDate');
  if (dateInput && !dateInput.value) {
    const today  = new Date();
    const offset = today.getTimezoneOffset();
    dateInput.value = new Date(today.getTime() - offset * 60000).toISOString().split('T')[0];
  }

  if (role === 'ADMIN' || role === 'RETAIL') {
    const switcher = document.getElementById('adminStoreSwitcher');
    const select   = document.getElementById('adminEntryStoreSelect');
    if (switcher) switcher.classList.remove('hidden');
    if (select && select.options.length <= 1) {
      const storeHandler = function(stores) {
        select.innerHTML = '';
        let matched = false;
        stores.forEach(name => {
          const opt = document.createElement('option');
          opt.value = opt.text = name;
          if (name === store) { opt.selected = true; matched = true; }
          select.appendChild(opt);
        });
        // Si activeStore no es una tienda real, auto-selecciona la primera
        const activeForFetch = matched ? store : stores[0];
        if (!matched && stores.length > 0) select.value = stores[0];
        if (activeForFetch) {
          sessionStorage.setItem('activeStore', activeForFetch);
          const titulo = document.getElementById('displayStoreName');
          if (titulo) titulo.innerText = activeForFetch;
          fetchStoreData();
        }
      };
      loadStoresForCurrentUser(storeHandler);
    }
  } else {
    setTimeout(() => fetchStoreData(), 300);
  }

  // Drag & drop sobre el área de upload
  const dropZone = document.querySelector('[onclick="document.getElementById(\'fileInput\').click()"]');
  const fileInput = document.getElementById('fileInput');
  if (dropZone && fileInput) {
    dropZone.addEventListener('dragover', function(e) {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', function(e) {
      if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag-over');
    });
    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const dt = e.dataTransfer;
      if (!dt || !dt.files || dt.files.length === 0) return;
      const newInput = Object.create(fileInput);
      Object.defineProperty(newInput, 'files', { value: dt.files });
      handleFileSelect(newInput);
    });
  }
}

function switchStoreAsAdmin(newStore) {
  if (!isRetailStoreAllowed(newStore)) return alert('Esta ubicación no pertenece a tu país asignado.');
  sessionStorage.setItem('activeStore', newStore);
  const titulo = document.getElementById('displayStoreName');
  if (titulo) titulo.innerText = newStore;
  const c = document.getElementById('entry-container');
  if (c) c.style.opacity = '0.4';
  fetchStoreData();
  setTimeout(() => { if (c) c.style.opacity = '1'; }, 300);
}

function fetchStoreData() {
  const store     = sessionStorage.getItem('activeStore');
  const dateInput = document.getElementById('inputDate');
  if (!store || !dateInput.value) return;

  const seq = ++_entryFetchSeq;
  const loadingBar = document.getElementById('entryLoadingBar');
  if (loadingBar) loadingBar.classList.remove('hidden');

  google.script.run
    .withSuccessHandler(function(data) {
      if (seq !== _entryFetchSeq) return;
      if (loadingBar) loadingBar.classList.add('hidden');
      if (!data) return;

      window.currentBudget = data.budget || {};
      window.lyRawData     = data.ly     || { ventas: 0, unidades: 0, tickets: 0, trafico: 0, stockICG: 0, stockRS: 0 };
      window.deptLY        = data.lyDept || { bg: 0, bu: 0, ck: 0, cu: 0, st: 0 };

      // LY reference blocks
      if (document.getElementById('lyVentas'))   document.getElementById('lyVentas').innerText   = '$' + Math.round(data.ly?.ventas   || 0).toLocaleString();
      if (document.getElementById('lyUnidades')) document.getElementById('lyUnidades').innerText = (data.ly?.unidades || 0).toLocaleString();
      if (document.getElementById('lyTickets'))  document.getElementById('lyTickets').innerText  = (data.ly?.tickets  || 0).toLocaleString();
      if (document.getElementById('lyTrafico'))  document.getElementById('lyTrafico').innerText  = (data.ly?.trafico  || 0).toLocaleString();

      // Dept LY reference
      const dFmt = { minimumFractionDigits: 2, maximumFractionDigits: 2 };
      if (document.getElementById('lyBg')) document.getElementById('lyBg').innerText = '$' + (window.deptLY.bg || 0).toLocaleString(undefined, dFmt);
      if (document.getElementById('lyBu')) document.getElementById('lyBu').innerText = '$' + (window.deptLY.bu || 0).toLocaleString(undefined, dFmt);
      if (document.getElementById('lyCk')) document.getElementById('lyCk').innerText = '$' + (window.deptLY.ck || 0).toLocaleString(undefined, dFmt);
      if (document.getElementById('lyCu')) document.getElementById('lyCu').innerText = '$' + (window.deptLY.cu || 0).toLocaleString(undefined, dFmt);
      if (document.getElementById('lySt')) document.getElementById('lySt').innerText = '$' + (window.deptLY.st || 0).toLocaleString(undefined, dFmt);

      // TY inputs — se asignan ANTES de cualquier cálculo
      const _fmtD = v => (v !== '' && v != null && v !== false) ? parseFloat(v).toFixed(2) : '';
      const _fmtI = v => (v !== '' && v != null && v !== false) ? String(Math.round(parseFloat(v))) : '';
      document.getElementById('valVentas').value   = _fmtD(data.ty?.ventas);
      document.getElementById('valTrafico').value  = _fmtI(data.ty?.trafico);
      document.getElementById('valUnidades').value = _fmtI(data.ty?.unidades);
      document.getElementById('valTickets').value  = _fmtI(data.ty?.tickets);
      document.getElementById('valStockICG').value = _fmtI(data.ty?.stockICG);
      document.getElementById('valStockRS').value  = _fmtI(data.ty?.stockRS);

      document.getElementById('valBg').value = data.tyDept?.bg || '';
      document.getElementById('valBu').value = data.tyDept?.bu || '';
      document.getElementById('valCk').value = data.tyDept?.ck || '';
      document.getElementById('valCu').value = data.tyDept?.cu || '';
      document.getElementById('valSt').value = data.tyDept?.st || '';

      // Ahora que los inputs YA tienen sus valores correctos, calculamos todo
      setTimeout(() => {
        if (typeof calculateComps        === 'function') calculateComps();
        if (typeof validateDeptSum       === 'function') validateDeptSum();
        if (typeof updateStockComparison === 'function') updateStockComparison();
        updateBudgetDisplay(); // ← último, lee valVentas con el valor correcto
      }, 200);
    })
    .withFailureHandler(err => {
      if (loadingBar) loadingBar.classList.add('hidden');
      console.error('Error en fetchStoreData:', err);
    })
    .getStoreDataForDate(store, dateInput.value);
}

function submitEntry() {
  const btn   = document.getElementById('submitBtn');
  const store = sessionStorage.getItem('activeStore');
  const date  = document.getElementById('inputDate').value;
  if (!date)  return alert('⚠️ Por favor, selecciona una fecha.');
  if (!store) return alert('Sesión expirada.');
  btn.disabled = true;
  btn.innerHTML = '⏳ ENVIANDO...';

  const v = parseFloat(document.getElementById('valVentas').value)   || 0;
  const u = parseInt(document.getElementById('valUnidades').value)   || 0;
  const t = parseInt(document.getElementById('valTickets').value)    || 0;

  const metrics = {
    ventas:   v, unidades: u, tickets: t,
    trafico:  parseInt(document.getElementById('valTrafico').value)  || 0,
    stockICG: parseInt(document.getElementById('valStockICG').value) || 0,
    stockRS:  parseInt(document.getElementById('valStockRS').value)  || 0,
    apt: t > 0 ? v / t : 0,
    aur: u > 0 ? v / u : 0,
    upt: t > 0 ? u / t : 0
  };

  const deptMetrics = {
    bg: parseFloat(document.getElementById('valBg').value) || 0,
    bu: parseFloat(document.getElementById('valBu').value) || 0,
    ck: parseFloat(document.getElementById('valCk').value) || 0,
    cu: parseFloat(document.getElementById('valCu').value) || 0,
    st: parseFloat(document.getElementById('valSt').value) || 0
  };

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.innerHTML = 'ENVIAR DATOS <span class="material-symbols-outlined text-sm">send</span>';
      if (res.success) alert('✅ Datos guardados correctamente.');
      else alert('❌ Error: ' + res.message);
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.innerHTML = 'REINTENTAR ENVÍO';
      alert('❌ Error crítico: ' + err.message);
    })
    .submitDailyMetrics(store, date, metrics, deptMetrics);
}

let _entryFiles = [];

function handleFileSelect(input) {
  if (input.files && input.files.length > 0) {
    Array.from(input.files).forEach(f => {
      // Evitar duplicados por nombre + tamaño
      const exists = _entryFiles.some(e => e.name === f.name && e.size === f.size);
      if (!exists) _entryFiles.push(f);
    });
  }
  _updateUploadUI();
}

function _updateUploadUI() {
  const text    = document.getElementById('uploadText');
  const icon    = document.getElementById('uploadIcon');
  const clearBtn = document.getElementById('clearFilesBtn');
  if (_entryFiles.length > 0) {
    text.innerText = _entryFiles.length === 1
      ? 'ARCHIVO LISTO: ' + _entryFiles[0].name.toUpperCase()
      : _entryFiles.length + ' ARCHIVOS LISTOS PARA ENVIAR';
    text.className = 'text-xs font-black text-emerald-500 uppercase tracking-widest text-center';
    icon.style.color = '#10b981';
    if (clearBtn) clearBtn.classList.remove('hidden');
  } else {
    text.innerText = 'TOCA PARA SUBIR ARCHIVOS';
    text.className = 'text-xs font-bold text-zinc-500 uppercase tracking-widest text-center';
    icon.style.color = '';
    if (clearBtn) clearBtn.classList.add('hidden');
  }
}

function clearEntryFiles() {
  _entryFiles = [];
  const fi = document.getElementById('fileInput');
  if (fi) fi.value = '';
  _updateUploadUI();
}

function calculateComps() {
  if (!window.lyRawData) return;
  const v = parseFloat(document.getElementById('valVentas').value)   || 0;
  const u = parseFloat(document.getElementById('valUnidades').value) || 0;
  const t = parseFloat(document.getElementById('valTickets').value)  || 0;

  const mapping = [
    { act: v, ly: window.lyRawData.ventas,   id: 'compVentas',   prefix: 'LY: $' },
    { act: u, ly: window.lyRawData.unidades, id: 'compUnidades', prefix: 'LY: ' },
    { act: t, ly: window.lyRawData.tickets,  id: 'compTickets',  prefix: 'LY: ' },
    { act: parseFloat(document.getElementById('valTrafico').value) || 0, ly: window.lyRawData.trafico, id: 'compTrafico', prefix: 'LY: ' }
  ];
  mapping.forEach(item => {
    const badge = document.getElementById(item.id);
    if (!badge) return;
    if (item.ly > 0) {
      const diff  = ((item.act / item.ly) - 1) * 100;
      const color = diff >= 0 ? '#10b981' : '#ef4444';
      const icon  = diff >= 0 ? '▲' : '▼';
      badge.innerText = `${icon} ${Math.abs(diff).toFixed(1)}% LY`;
      badge.style.color = color;
    } else {
      badge.innerText = item.prefix + Math.round(item.ly || 0).toLocaleString();
      badge.style.color = '#93c5fd';
    }
  });
}

function validateDeptSum() {
  const depts = [
    { id: 'Bg', valTY: parseFloat(document.getElementById('valBg').value) || 0, key: 'bg' },
    { id: 'Bu', valTY: parseFloat(document.getElementById('valBu').value) || 0, key: 'bu' },
    { id: 'Ck', valTY: parseFloat(document.getElementById('valCk').value) || 0, key: 'ck' },
    { id: 'Cu', valTY: parseFloat(document.getElementById('valCu').value) || 0, key: 'cu' },
    { id: 'St', valTY: parseFloat(document.getElementById('valSt').value) || 0, key: 'st' }
  ];
  depts.forEach(dept => {
    const valLY    = window.deptLY ? (window.deptLY[dept.key] || 0) : 0;
    const compEl   = document.getElementById('comp' + dept.id);
    if (compEl) {
      if (valLY > 0 && dept.valTY > 0) {
        const porc  = ((dept.valTY / valLY) - 1) * 100;
        compEl.innerText    = (porc >= 0 ? '▲ ' : '▼ ') + Math.abs(porc).toFixed(1) + '%';
        compEl.style.color  = porc >= 0 ? '#10b981' : '#ef4444';
        compEl.style.fontWeight = 'bold';
      } else {
        compEl.innerText   = '--%';
        compEl.style.color = '#93c5fd';
        compEl.style.fontWeight = 'normal';
      }
    }
  });
}

function updateStockComparison() {
  const currentStock = parseFloat(document.getElementById('valStockICG')?.value) || 0;
  const lyStock      = parseFloat(window.lyRawData?.stockICG) || 0;
  const currentEl    = document.getElementById('stock-current-val');
  const lyEl         = document.getElementById('stock-ly-val');
  const badge        = document.getElementById('stock-comp-badge');
  if (currentEl) currentEl.innerText = Math.round(currentStock).toLocaleString();
  if (lyEl)      lyEl.innerText      = Math.round(lyStock).toLocaleString();
  if (!badge) return;
  if (lyStock > 0) {
    const diff = ((currentStock / lyStock) - 1) * 100;
    const isUp = diff >= 0;
    badge.innerText   = `${isUp ? '↑' : '↓'} ${Math.abs(diff).toFixed(1)}% VS LY`;
    badge.className   = isUp
      ? 'inline-flex px-4 py-2 rounded-full bg-emerald-100 text-emerald-600 text-[11px] font-black uppercase tracking-widest'
      : 'inline-flex px-4 py-2 rounded-full bg-red-100 text-red-600 text-[11px] font-black uppercase tracking-widest';
  } else {
    badge.innerText   = 'SIN LY';
    badge.className   = 'inline-flex px-4 py-2 rounded-full bg-blue-50 text-blue-500 text-[11px] font-black uppercase tracking-widest';
  }
}

// ─── BUDGET ───────────────────────────────────────────────────────────────────
function updateBudgetDisplay() {
  if (!window.currentBudget || typeof window.currentBudget.daily === 'undefined') return;

  const budget       = window.currentBudget;
  const daily        = parseFloat(budget.daily) || 0;
  // Leer el valor del input directamente (ya tiene el valor correcto al llamarse)
  const ventasActual = parseFloat(document.getElementById('valVentas')?.value) || 0;

  const metaInfo    = document.getElementById('meta-diaria-info');
  const badge       = document.getElementById('cumplimiento-badge');
  const progressBar = document.getElementById('budget-progress-bar');
  const progresoTxt = document.getElementById('progreso-texto');
  const weightCap   = document.getElementById('weight-caption');

  // Mostrar meta diaria
  if (metaInfo) metaInfo.innerText = '$' + Math.round(daily).toLocaleString();

  // Caption del peso
  if (weightCap && budget.weightUsed) {
    weightCap.innerText = `* Meta calculada con un peso del ${budget.weightUsed}% para este ${budget.dayName}.`;
  }

  // Calcular porcentaje de cumplimiento
  const porc = daily > 0 ? (ventasActual / daily) * 100 : 0;

  if (progresoTxt) progresoTxt.innerText = porc.toFixed(1) + '%';

  if (progressBar) {
    progressBar.style.width           = Math.min(porc, 100) + '%';
    progressBar.style.backgroundColor = porc >= 100 ? '#10b981' : porc >= 85 ? '#f59e0b' : '#60a5fa';
  }

  if (badge) {
    badge.innerText             = Math.round(porc) + '% OBJETIVO';
    badge.style.backgroundColor = porc >= 100 ? '#064e3b' : porc >= 85 ? '#78350f' : '#1e3a5f';
    badge.style.color           = porc >= 100 ? '#34d399' : porc >= 85 ? '#fbbf24' : '#93c5fd';
  }
}

function initBudget() {
  const store  = sessionStorage.getItem('activeStore');
  const nameEl = document.getElementById('budgetStoreName');
  if (nameEl) nameEl.innerText = store;

  const picker = document.getElementById('budgetMonthPicker');
  if (picker) picker.value = new Date().getMonth();

  loadBudgetData();
}

function loadBudgetData() {
  const store = sessionStorage.getItem('activeStore');
  const picker = document.getElementById('budgetMonthPicker');
  const monthIndex = picker ? parseInt(picker.value) : new Date().getMonth();

  ['mtd-actual','mtd-target','ytd-actual','ytd-target'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerText = 'Cargando...';
  });
  google.script.run
    .withSuccessHandler(function(data) {
      if (!data || !data.mtd) return;
      document.getElementById('mtd-actual').innerText  = '$' + Math.round(data.mtd.actual).toLocaleString();
      document.getElementById('mtd-target').innerText  = 'Meta: $' + Math.round(data.mtd.target).toLocaleString();
      document.getElementById('mtd-pct').innerText     = data.mtd.pct.toFixed(1) + '%';
      document.getElementById('mtd-bar').style.width   = Math.min(data.mtd.pct, 100) + '%';
      document.getElementById('ytd-actual').innerText  = '$' + Math.round(data.ytd.actual).toLocaleString();
      document.getElementById('ytd-target').innerText  = 'Meta: $' + Math.round(data.ytd.target).toLocaleString();
      document.getElementById('ytd-pct').innerText     = data.ytd.pct.toFixed(1) + '%';
      document.getElementById('ytd-bar').style.width   = Math.min(data.ytd.pct, 100) + '%';
      const mtdBar = document.getElementById('mtd-bar');
      if (data.mtd.pct >= 100) mtdBar.style.backgroundColor = '#10b981';
      else if (data.mtd.pct >= 85) mtdBar.style.backgroundColor = '#f59e0b';
    })
    .withFailureHandler(err => alert('Error al obtener presupuesto: ' + err))
    .getBudgetData(store, monthIndex);
}

function initAdminBudget() {
  const select = document.getElementById('adminStoreSelector');

function refreshAdminBudget() {
  const role = (sessionStorage.getItem('userRole') || '').toUpperCase();
  const selection = document.getElementById('adminStoreSelector').value;
  const isGlobal  = role === 'ADMIN' && (selection === 'GLOBAL');
  if (role === 'RETAIL' && !isRetailStoreAllowed(selection)) return alert('Esta ubicación no pertenece a tu país asignado.');
  const monthPicker = document.getElementById('adminBudgetMonthPicker');
  const monthIndex = monthPicker ? parseInt(monthPicker.value) : new Date().getMonth();
  document.getElementById('admin-mtd-actual').innerText = 'CALCULANDO...';
  document.getElementById('admin-ytd-actual').innerText = 'CALCULANDO...';
  google.script.run
    .withSuccessHandler(function(data) {
      if (!data) return;
      const result = isGlobal ? data.global : data;
      if (!result || !result.mtd) return;
      document.getElementById('admin-mtd-actual').innerText = '$' + Math.round(result.mtd.actual || 0).toLocaleString();
      document.getElementById('admin-mtd-target').innerText = 'Meta: $' + Math.round(result.mtd.target || 0).toLocaleString();
      document.getElementById('admin-mtd-pct').innerText    = (result.mtd.pct || 0).toFixed(1) + '%';
      document.getElementById('admin-mtd-bar').style.width  = Math.min(result.mtd.pct || 0, 100) + '%';
      document.getElementById('admin-ytd-actual').innerText = '$' + Math.round(result.ytd.actual || 0).toLocaleString();
      document.getElementById('admin-ytd-target').innerText = 'Meta: $' + Math.round(result.ytd.target || 0).toLocaleString();
      document.getElementById('admin-ytd-pct').innerText    = (result.ytd.pct || 0).toFixed(1) + '%';
      document.getElementById('admin-ytd-bar').style.width  = Math.min(result.ytd.pct || 0, 100) + '%';

      // Renderiza desglose por tienda si disponible
      if (isGlobal && data.individualStores) renderStoreBudgetBreakdown(data.individualStores);
    })
    .withFailureHandler(err => { console.error(err); })
    .getAdminBudgetData(selection, isGlobal, monthIndex, role === 'RETAIL' ? getRetailCountry() : null);
}

function renderStoreBudgetBreakdown(stores) {
  const container = document.getElementById('store-budget-breakdown');
  const tbody     = document.getElementById('store-budget-tbody');
  if (!container || !tbody || !stores.length) return;
  tbody.innerHTML = stores.map(s => {
    const pct      = s.mtdPct || 0;
    const pctColor = pct >= 100 ? '#10b981' : pct >= 80 ? '#f59e0b' : '#ef4444';
    const country  = getStoreCountry(s.name) || '---';
    const flag     = COUNTRY_FLAGS[country]   || '';
    return `<tr data-country="${country}" class="hover:bg-blue-50/50 transition-colors">
      <td class="px-6 py-4 font-black text-zinc-800 text-[11px]">${s.name}</td>
      <td class="px-6 py-4 text-center"><span class="country-badge">${flag} ${country}</span></td>
      <td class="px-6 py-4 text-right font-bold text-[11px]">$${Math.round(s.mtdActual || 0).toLocaleString()}</td>
      <td class="px-6 py-4 text-right text-zinc-400 text-[11px]">$${Math.round(s.mtdTarget || 0).toLocaleString()}</td>
      <td class="px-6 py-4 text-right font-black text-[12px]" style="color:${pctColor}">${pct.toFixed(1)}%</td>
    </tr>`;

}

function initAnalysis() {
  const store = sessionStorage.getItem('activeStore');
  const role  = sessionStorage.getItem('userRole');
  const el    = document.getElementById('analysisStoreTitle');
  if (el) el.innerText = 'Análisis — ' + store;

  if (role === 'ADMIN' || role === 'RETAIL') {
    const switcher = document.getElementById('adminAnalysisStoreSwitcher');
    const select   = document.getElementById('adminAnalysisStoreSelect');
    if (switcher) switcher.classList.remove('hidden');
    if (select) {
      const analysisHandler = function(stores) {
        select.innerHTML = '';
        let matched = false;
        stores.forEach(function(name) {
          const opt = document.createElement('option');
          opt.value = opt.text = name;
          if (name === store) { opt.selected = true; matched = true; }
          select.appendChild(opt);
        });
        if (!matched && stores.length > 0) {
          select.value = stores[0];
          sessionStorage.setItem('activeStore', stores[0]);
          const el = document.getElementById('analysisStoreTitle');
          if (el) el.innerText = 'Análisis — ' + stores[0];
        }
      };
      loadStoresForCurrentUser(analysisHandler);
    }
  }

  populateWeeks();
}

function switchAnalysisStore(newStore) {
  if (!isRetailStoreAllowed(newStore)) return alert('Esta ubicación no pertenece a tu país asignado.');
  sessionStorage.setItem('activeStore', newStore);
  const title = document.getElementById('analysisStoreTitle');
  if (title) title.innerText = 'Análisis — ' + newStore;
  const container = document.getElementById('analysis-container');
  if (container) container.style.opacity = '0.4';
  fetchWeeklyData();
  setTimeout(function() {
    if (container) container.style.opacity = '1';
  }, 400);
}

function populateWeeks() {
  const select = document.getElementById('weekPicker');
  if (!select) return;
  select.innerHTML = '<option disabled>Cargando semanas...</option>';
  google.script.run
    .withSuccessHandler(function(currentWeek) {
      select.innerHTML = '';
      for (let i = currentWeek; i >= 1; i--) {
        const opt  = document.createElement('option');
        opt.value  = i;
        opt.text   = 'Semana ' + i + (i === currentWeek ? ' (ACTUAL)' : '');
        select.appendChild(opt);
      }
      select.value = currentWeek;
      fetchWeeklyData();
    })
    .withFailureHandler(() => {
      select.innerHTML = '<option value="15">Semana 15</option>';
      fetchWeeklyData();
    })
    .getExactWeekNum();
}

function fetchWeeklyData() {
  const store = sessionStorage.getItem('activeStore');
  const week  = document.getElementById('weekPicker').value;
  if (!store) return;

  const seq = ++_weeklyFetchSeq;
  const ids = ['week-ventas','week-unidades','week-tickets','week-trafico',
               'upt-val','apt-val','conv-val','comp-v','comp-u','comp-t','comp-tr',
               'upt-comp','apt-comp','conv-comp','ly-val-v','ly-val-u','ly-val-t','ly-val-tr'];
  ids.forEach(id => { const el = document.getElementById(id); if (el) el.innerText = '...'; });

  google.script.run.withSuccessHandler(function(data) {
    if (seq !== _weeklyFetchSeq) return;
    if (!data) { ids.forEach(id => { const el = document.getElementById(id); if (el) el.innerText = '0'; }); return; }
    try {
      document.getElementById('week-ventas').innerText   = '$' + ((data.ventas?.actual   || 0) / 1000).toFixed(1) + 'k';
      document.getElementById('week-unidades').innerText = (data.unidades?.actual || 0).toLocaleString();
      document.getElementById('week-tickets').innerText  = (data.tickets?.actual  || 0).toLocaleString();
      document.getElementById('week-trafico').innerText  = ((data.trafico?.actual  || 0) / 1000).toFixed(1) + 'k';
      document.getElementById('ly-val-v').innerText      = 'LY: $' + ((data.ventas?.ly   || 0) / 1000).toFixed(1) + 'k';
      document.getElementById('ly-val-u').innerText      = 'LY: '  + (data.unidades?.ly  || 0).toLocaleString();
      document.getElementById('ly-val-t').innerText      = 'LY: '  + (data.tickets?.ly   || 0).toLocaleString();
      document.getElementById('ly-val-tr').innerText     = 'LY: '  + ((data.trafico?.ly  || 0) / 1000).toFixed(1) + 'k';
      document.getElementById('upt-val').innerText       = (parseFloat(data.upt?.actual)  || 0).toFixed(2);
      document.getElementById('apt-val').innerText       = '$' + Math.round(data.apt?.actual || 0);
      document.getElementById('conv-val').innerText      = (parseFloat(data.conv?.actual)  || 0).toFixed(1) + '%';
      applyWeeklySemaforo('card-v',  'comp-v',  data.ventas?.comp   || 0);
      applyWeeklySemaforo('card-u',  'comp-u',  data.unidades?.comp || 0);
      applyWeeklySemaforo('card-t',  'comp-t',  data.tickets?.comp  || 0);
      applyWeeklySemaforo('card-tr', 'comp-tr', data.trafico?.comp  || 0);
      applyKPIBadge('upt-comp',  data.upt?.comp  || 0);
      applyKPIBadge('apt-comp',  data.apt?.comp  || 0);
      applyKPIBadge('conv-comp', data.conv?.comp || 0);
      if (typeof loadSavedFeedback === 'function') loadSavedFeedback();
    } catch (err) { console.error('Error procesando datos:', err); }
  }).getWeeklySummary(store, week);
}

function applyWeeklySemaforo(cardId, compId, value) {
  const card  = document.getElementById(cardId);
  const label = document.getElementById(compId);
  if (!card || !label) return;
  const pct = Math.abs(value).toFixed(1);
  if (value > 0) {
    card.style.backgroundColor = '#064e3b';
    label.innerText   = `▲ ${pct}% VS LY`;
    label.style.color = '#34d399';
  } else if (value < 0) {
    card.style.backgroundColor = '#450a0a';
    label.innerText   = `▼ ${pct}% VS LY`;
    label.style.color = '#f87171';
  } else {
    card.style.backgroundColor = '#0D47A1';
    label.innerText   = '0% VS LY';
    label.style.color = '#93c5fd';
  }
}

function applyKPIBadge(badgeId, value) {
  const badge = document.getElementById(badgeId);
  if (!badge) return;
  const color = value >= 0 ? '#10b981' : '#ef4444';
  const icon  = value >= 0 ? '▲' : '▼';
  badge.innerHTML = `<span style="color:${color}">${icon} ${Math.abs(value).toFixed(1)}% VS LY</span>`;
}

function saveFeedback() {

    btn.innerText = 'Guardar Análisis';
    btn.disabled  = false;

function loadSavedFeedback() {
  const store = sessionStorage.getItem('activeStore');

function generateAITips() {

window._adminStores = [];
window._adminSort = { key: 'unidades', dir: 'desc' };

function initAdmin() {
  const role = (sessionStorage.getItem('userRole') || '').toUpperCase();
  if (role === 'RETAIL') {
    // Ocultar completamente el selector de país — RETAIL solo ve su país
    const countryFocusEl = document.getElementById('adminCountryFocus');
    if (countryFocusEl) {
      countryFocusEl.value = getRetailCountry();
      // parentElement es el div contenedor del selector
      const card = countryFocusEl.parentElement;
      if (card) card.style.display = 'none';
    }
  }
  populateAdminWeeks();
  const picker = document.getElementById('adminWeekPicker');
  if (picker) picker.onchange = loadAdminData;
}

function populateAdminWeeks() {
  const select = document.getElementById('adminWeekPicker');
  if (!select) return;
  select.innerHTML = '<option disabled>Cargando semanas...</option>';
  google.script.run
    .withSuccessHandler(function(currentWeek) {
      select.innerHTML = '';
      for (let i = currentWeek; i >= 1; i--) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.text  = 'Semana ' + i;
        select.appendChild(opt);
      }
      select.value = currentWeek;
      loadAdminData();
    })
    .withFailureHandler(() => {
      select.innerHTML = '<option value="15">Semana 15</option>';
      loadAdminData();
    })
    .getExactWeekNum();
}

function loadAdminData() {
  const picker  = document.getElementById('adminWeekPicker');
  if (!picker) return;
  const week    = picker.value;
  const role    = (sessionStorage.getItem('userRole') || '').toUpperCase();
  const country = role === 'RETAIL'
    ? (getRetailCountry() || 'REGIONAL')
    : (document.getElementById('adminCountryFocus')?.value || 'REGIONAL');
  const tbody   = document.getElementById('admin-table-body');
  if (tbody) tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:20px">Cargando Ranking...</td></tr>';

  // Update country badge
  const badge = document.getElementById('admin-country-badge');
  if (badge) {
    if (country === 'REGIONAL') { badge.classList.add('hidden'); }
    else {
      badge.classList.remove('hidden');
      badge.innerText = (COUNTRY_FLAGS[country] || '') + ' ' + country;
    }
  }

  google.script.run.withSuccessHandler(function(results) {
    if (!results || !results.stores || results.stores.length === 0) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:20px">Sin datos para la Semana ' + week + '</td></tr>';
      return;
    }

    // Filter by country if needed
    let stores = results.stores;
    if (country !== 'REGIONAL') {
      stores = stores.filter(s => getStoreCountry(s.name) === country);
    }

    window._adminStores = stores.slice();
    window._adminSort = { key: 'unidades', dir: 'desc' };

    // Update header KPIs
    const totalVentas = stores.reduce((sum, s) => sum + (s.ventas || 0), 0);
    const totalUnids  = stores.reduce((sum, s) => sum + (s.unidades || 0), 0);
    const totalTickets = stores.reduce((sum, s) => sum + (s.tickets || 0), 0);

    const el1 = document.getElementById('total-ventas-regional');
    if (el1) el1.innerText = '$' + Math.round(totalVentas).toLocaleString();

    if (stores.length > 0) {
      const top = stores[0];
      const el2 = document.getElementById('top-store-name');
      const el3 = document.getElementById('top-store-country');
      if (el2) el2.innerText = top.name;
      if (el3) {
        const c = getStoreCountry(top.name) || '---';
        el3.innerText = (COUNTRY_FLAGS[c] || '') + ' ' + c;
      }
    }

    const avgUPT = totalTickets > 0 ? (totalUnids / totalTickets).toFixed(2) : '0.00';
    const el4    = document.getElementById('avg-upt-regional');
    if (el4) el4.innerText = avgUPT;

    updateAdminTopPerformers(stores);
    renderAdminRanking();
  }).getRegionalData(week, role === 'RETAIL' ? getRetailCountry() : null);
}

function updateAdminTopPerformers(stores) {
  const list = stores || [];
  const byNumber = (key) => list
    .filter(s => Number(s[key]) > 0)
    .sort((a, b) => Number(b[key]) - Number(a[key]))[0];
  const setTop = (prefix, store, valueLabel) => {
    const storeEl = document.getElementById('top-' + prefix + '-store');
    const countryEl = document.getElementById('top-' + prefix + '-country');
    const valueEl = document.getElementById('top-' + prefix + '-value');
    if (!store) {
      if (storeEl) storeEl.innerText = '---';
      if (countryEl) countryEl.innerText = '---';
      if (valueEl) valueEl.innerText = valueLabel;
      return;
    }
    const country = getStoreCountry(store.name) || '---';
    if (storeEl) storeEl.innerText = store.name;
    if (countryEl) countryEl.innerText = (COUNTRY_FLAGS[country] || '') + ' ' + country;
    if (valueEl) valueEl.innerText = valueLabel;
  };

  const topConv = byNumber('conv');
  const topUpt  = byNumber('upt');
  const topApt  = byNumber('apt');
  setTop('conv', topConv, topConv ? Number(topConv.conv || 0).toFixed(1) + '%' : '0.0%');
  setTop('upt', topUpt, topUpt ? Number(topUpt.upt || 0).toFixed(2) : '0.00');
  setTop('apt', topApt, topApt ? '$' + Number(topApt.apt || 0).toFixed(2) : '$0.00');
}

function sortAdminRanking(key) {
  const current = window._adminSort || { key: 'unidades', dir: 'desc' };
  const numericKeys = ['ventas','compV','unidades','compU','trafico','compTr','upt','apt','aur','conv'];
  const defaultDir = numericKeys.includes(key) ? 'desc' : 'asc';
  window._adminSort = {
    key: key,
    dir: current.key === key ? (current.dir === 'asc' ? 'desc' : 'asc') : defaultDir
  };
  renderAdminRanking();
}

function renderAdminRanking() {
  const tbody = document.getElementById('admin-table-body');
  if (!tbody) return;

  const sort = window._adminSort || { key: 'unidades', dir: 'desc' };
  const stores = (window._adminStores || []).slice().sort(function(a, b) {
    const aVal = sort.key === 'country' ? getStoreCountry(a.name) : a[sort.key];
    const bVal = sort.key === 'country' ? getStoreCountry(b.name) : b[sort.key];
    const aEmpty = aVal === null || aVal === undefined || aVal === '';
    const bEmpty = bVal === null || bVal === undefined || bVal === '';
    if (aEmpty && bEmpty) return 0;
    if (aEmpty) return 1;
    if (bEmpty) return -1;

    if (typeof aVal === 'string' || typeof bVal === 'string') {
      return sort.dir === 'asc'
        ? String(aVal).localeCompare(String(bVal))
        : String(bVal).localeCompare(String(aVal));
    }

    return sort.dir === 'asc'
      ? Number(aVal) - Number(bVal)
      : Number(bVal) - Number(aVal);
  });

  document.querySelectorAll('.admin-sort-header').forEach(function(btn) {
    const isActive = btn.dataset.sortKey === sort.key;
    btn.classList.toggle('is-active', isActive);
    const icon = btn.querySelector('.admin-sort-icon');
    if (icon) icon.innerText = isActive ? (sort.dir === 'asc' ? '▲' : '▼') : '';
  });

  tbody.innerHTML = stores.map((s, idx) => {
    const storeCountry = getStoreCountry(s.name) || '---';
    const flag         = COUNTRY_FLAGS[storeCountry] || '';
    const rankColor    = idx === 0 ? 'bg-blue-50' : idx === 1 ? 'bg-blue-50/50' : '';
    return `<tr class="${rankColor} hover:bg-blue-50/30 transition-colors">
      <td class="px-4 py-3 font-black text-zinc-800 text-[12px]">
        <span class="inline-flex items-center gap-2">
          <span class="text-[10px] font-black text-zinc-400">#${idx + 1}</span>
          ${s.name}
        </span>
      </td>
      <td class="px-4 py-3 text-center">
        <span class="country-badge">${flag} ${storeCountry}</span>
      </td>
      <td class="px-4 py-3 text-right font-bold">$${Math.round(s.ventas || 0).toLocaleString()}</td>
      <td class="px-4 py-3 text-right text-xs font-black" style="color:${s.compV==null?'#999':s.compV>=0?'#16a34a':'#dc2626'}">${s.compV==null?'N/D':(s.compV>=0?'+':'')+s.compV.toFixed(1)+'%'}</td>
      <td class="px-4 py-3 text-right">${Math.round(s.unidades || 0).toLocaleString()}</td>
      <td class="px-4 py-3 text-right text-xs font-black" style="color:${s.compU==null?'#999':s.compU>=0?'#16a34a':'#dc2626'}">${s.compU==null?'N/D':(s.compU>=0?'+':'')+s.compU.toFixed(1)+'%'}</td>
      <td class="px-4 py-3 text-right">${Math.round(s.trafico || 0).toLocaleString()}</td>
      <td class="px-4 py-3 text-right text-xs font-black" style="color:${s.compTr==null?'#999':s.compTr>=0?'#16a34a':'#dc2626'}">${s.compTr==null?'N/D':(s.compTr>=0?'+':'')+s.compTr.toFixed(1)+'%'}</td>

function initComparativo() {
  const role      = (sessionStorage.getItem('userRole') || '').toUpperCase();
  const container = document.getElementById('adminStoreFilterContainer');
  const tyStart   = document.getElementById('tyStart');
  const tyEnd     = document.getElementById('tyEnd');
  const lyStart   = document.getElementById('lyStart');
  const lyEnd     = document.getElementById('lyEnd');

  const syncDate = (source, target) => {
    if (!source.value) return;
    let d = new Date(source.value + 'T00:00:00');
    d.setDate(d.getDate() - 364);
    target.value = d.toISOString().split('T')[0];
  };

  tyStart.onchange = () => syncDate(tyStart, lyStart);
  tyEnd.onchange   = () => syncDate(tyEnd,   lyEnd);

  const today = new Date();
  tyEnd.value = today.toISOString().split('T')[0];
  let start   = new Date();
  start.setDate(today.getDate() - 6);
  tyStart.value = start.toISOString().split('T')[0];
  syncDate(tyStart, lyStart);
  syncDate(tyEnd, lyEnd);

  if (role === 'ADMIN' || role === 'RETAIL') {
    if (container) container.classList.remove('hidden');
    const comboHandler = function(stores) {
      const group = document.getElementById('storeCheckboxGroup');
      if (!group) return;
      group.innerHTML = stores.map(s => {
        const country = getStoreCountry(s);
        const flag    = COUNTRY_FLAGS[country]  || '';
        return `<label class="flex items-center bg-white border border-blue-100 px-4 py-2 rounded-full text-[10px] font-black cursor-pointer hover:border-primary hover:text-primary transition-all gap-2" data-country="${country}">
          <input type="checkbox" name="storeCheck" value="${s}" class="mr-1 accent-[#1565C0]">
          ${flag} ${s}
        </label>`;
      }).join('');
    };
    loadStoresForCurrentUser(comboHandler);
  }
}

function fetchCustomComparison() {

    if (role === 'RETAIL') selectedStores = selectedStores.filter(isRetailStoreAllowed);
  } else {
    selectedStores = [sessionStorage.getItem('activeStore')];
  }
  if (selectedStores.length === 0) return alert('⚠️ Selecciona al menos una ubicación.');

    ly: { start: document.getElementById('lyStart').value, end: document.getElementById('lyEnd').value }
  };

    .withSuccessHandler(function(response) {

      const generalData = response.generalData || response;

function sendEntryEmail() {
  const btn       = document.getElementById('emailBtn');
  const store     = sessionStorage.getItem('activeStore');
  const date      = document.getElementById('inputDate').value;
  const fileInput = document.getElementById('fileInput');
  const comments  = document.getElementById('entryComments')?.value.trim() || '';
  if (!store) return alert('Sesión expirada.');
  if (!date)  return alert('⚠️ Por favor, selecciona una fecha.');

  const v = parseFloat(document.getElementById('valVentas').value)   || 0;
  const u = parseInt(document.getElementById('valUnidades').value)   || 0;
  const t = parseInt(document.getElementById('valTickets').value)    || 0;

  const metrics = {
    ventas: v, unidades: u, tickets: t,
    trafico:  parseInt(document.getElementById('valTrafico').value)  || 0,
    stockICG: parseInt(document.getElementById('valStockICG').value) || 0,
    stockRS:  parseInt(document.getElementById('valStockRS').value)  || 0,
    apt: t > 0 ? v / t : 0, aur: u > 0 ? v / u : 0, upt: t > 0 ? u / t : 0,
    ventasLY: window.lyRawData?.ventas || 0
  };
  const deptMetrics = {
    bg: parseFloat(document.getElementById('valBg').value) || 0,
    bu: parseFloat(document.getElementById('valBu').value) || 0,
    ck: parseFloat(document.getElementById('valCk').value) || 0,
    cu: parseFloat(document.getElementById('valCu').value) || 0,
    st: parseFloat(document.getElementById('valSt').value) || 0
  };
  const deptLY = { bg: window.deptLY?.bg||0, bu: window.deptLY?.bu||0, ck: window.deptLY?.ck||0, cu: window.deptLY?.cu||0, st: window.deptLY?.st||0 };

  btn.disabled = true;
  btn.innerHTML = '⏳ PREPARANDO CORREO...';

  const files = _entryFiles.slice();
  const finishSend = (attachmentsPayload) => {
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.innerHTML = 'ENVIAR CORREO <span class="material-symbols-outlined text-sm">mail</span>';
        if (res.success) { clearEntryFiles(); alert('✅ Correo enviado correctamente.'); }
        else alert('❌ Error al enviar correo: ' + res.message);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = 'ENVIAR CORREO <span class="material-symbols-outlined text-sm">mail</span>';
        alert('❌ Error crítico: ' + err.message);
      })
      .sendEntryEmail(store, date, metrics, deptMetrics, attachmentsPayload, deptLY, comments);
  };

  if (files.length === 0) { finishSend([]); return; }
  let completed = 0;
  const attachmentsPayload = [];
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e) {
      attachmentsPayload.push({ fileName: file.name, mimeType: file.type || 'application/octet-stream', base64Data: e.target.result.split(',')[1] });
      if (++completed === files.length) finishSend(attachmentsPayload);
    };
    reader.onerror = function() { if (++completed === files.length) finishSend(attachmentsPayload); };
    reader.readAsDataURL(file);
  });
}

window._rendAllRows   = [];
window._rendFiltered  = [];
window._rendPage      = 0;
window._rendPageSize  = 50;
window._rendIsAdmin   = false;

const REND_FLAGS = {
  'VENEZUELA': '🇻🇪', 'DOMINICAN REBUPLIC': '🇩🇴', 'DOMINICAN REPUBLIC': '🇩🇴',
  'PANAMA': '🇵🇦', 'GUATEMALA': '🇬🇹', 'COSTA RICA': '🇨🇷',
  'CURACAO': '🇨🇼', 'EL SALVADOR': '🇸🇻'
};

function initRendimiento() {
  document.getElementById('rend-loading').classList.remove('hidden');
  document.getElementById('rend-content').classList.add('hidden');
  document.getElementById('rend-empty').classList.add('hidden');

  const role       = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();
  const isAdmin    = role === 'ADMIN';
  const isRetail   = role === 'RETAIL';
  const store      = (sessionStorage.getItem('activeStore') || '').trim().toUpperCase();
  const userCountry = sessionStorage.getItem('userCountry') || '';
  window._rendIsAdmin = isAdmin || isRetail;

  const filtroPais   = document.getElementById('rend-filtro-pais');
  const filtroTienda = document.getElementById('rend-filtro-tienda');
  // ADMIN: ve filtro país y tienda. RETAIL: solo filtro tienda (país fijo). STORE: ninguno.
  if (filtroPais)   { filtroPais.classList.toggle('hidden', !isAdmin);            filtroPais.classList.toggle('flex', isAdmin); }
  if (filtroTienda) { filtroTienda.classList.toggle('hidden', !(isAdmin||isRetail)); filtroTienda.classList.toggle('flex', isAdmin||isRetail); }

  const statsGrid = document.getElementById('rend-stats-grid');
  if (statsGrid) statsGrid.classList.toggle('hidden', !(isAdmin || isRetail));

  const filtros = {
    pais:   isAdmin  ? (document.getElementById('rend-filter-pais')?.value   || 'TODOS')
            : isRetail ? getRetailCountry()
            : 'TODOS',
    tienda: isAdmin  ? (document.getElementById('rend-filter-tienda')?.value || 'TODAS')
            : isRetail ? (document.getElementById('rend-filter-tienda')?.value || 'TODAS')
            : store,
    status: document.getElementById('rend-filter-status')?.value || 'TODOS',
    scopePais: isRetail ? getRetailCountry() : ''
  };

  google.script.run
    .withSuccessHandler(function(data) {
      document.getElementById('rend-loading').classList.add('hidden');
      if (!data || !data.rows || data.rows.length === 0) {
        showRendimientoEmpty(data);
        return;
      }
      _renderRendimiento(data);
    })
    .withFailureHandler(function(err) {
      document.getElementById('rend-loading').classList.add('hidden');
      showRendimientoEmpty(null);
      console.error('Rendimiento error:', err);
    })
    .getRendimientoData(filtros);
}

function showRendimientoEmpty(data) {
  const emptyEl = document.getElementById('rend-empty');
  const iconEl = document.getElementById('rend-empty-icon');
  const titleEl = document.getElementById('rend-empty-title');
  const messageEl = document.getElementById('rend-empty-message');
  if (!emptyEl) return;

  const hasReport = !!(data && (data.reportDate || data.lastUpdate));
  const totalPending = Number(data?.totalPending || 0);
  const isFilteredEmpty = hasReport && totalPending > 0;

  if (hasReport && totalPending === 0) {
    if (iconEl) iconEl.innerText = 'check_circle';
    if (titleEl) titleEl.innerText = '¡Felicidades! No tienes cursos pendientes';
    if (messageEl) messageEl.innerText = data.reportDate
      ? 'Reporte Enocta actualizado al ' + data.reportDate + '.'
      : 'Reporte Enocta actualizado.';
  } else if (isFilteredEmpty) {
    if (iconEl) iconEl.innerText = 'filter_alt_off';
    if (titleEl) titleEl.innerText = 'Sin resultados para este filtro';
    if (messageEl) messageEl.innerText = 'Ajusta los filtros para ver otras actividades pendientes.';
  } else {
    if (iconEl) iconEl.innerText = 'school';
    if (titleEl) titleEl.innerText = 'Sin datos de Enocta aún';
    if (messageEl) messageEl.innerHTML = 'El reporte se procesa automáticamente cada lunes. Para forzar el procesamiento, ejecuta <strong>processEnoctaReport()</strong> desde el editor de Apps Script.';
  }

  emptyEl.classList.remove('hidden');
}

function _renderRendimiento(data) {
  document.getElementById('rend-content').classList.remove('hidden');

  const lastUpd = data.lastUpdate || '—';
  const repDate = data.reportDate || '—';
  document.getElementById('rend-meta').innerText =
    'Reporte Enocta: ' + repDate + ' | Procesado: ' + lastUpd;

  const isAdmin      = window._rendIsAdmin;
  const displayTotal = isAdmin ? (data.totalPending || data.rows.length) : data.rows.length;
  let totalIP = 0, totalNS = 0;
  data.rows.forEach(function(r) {
    if (r.status.toUpperCase() === 'IN PROGRESS') totalIP++;
    if (r.status.toUpperCase() === 'NOT STARTED') totalNS++;
  });
  document.getElementById('rend-total').innerText    = displayTotal;
  document.getElementById('rend-count-ip').innerText = totalIP;
  document.getElementById('rend-count-ns').innerText = totalNS;
  document.getElementById('rend-report-date').innerText =
    data.reportDate ? 'Reporte correspondiente al: ' + data.reportDate : '';

  if (isAdmin) {
    const statsGrid = document.getElementById('rend-stats-grid');
    const stats = data.stats || {};
    if (statsGrid) statsGrid.innerHTML = Object.keys(stats).sort().map(function(country) {
      const s    = stats[country];
      const flag = REND_FLAGS[country.toUpperCase()] || '🏳️';
      return '<div class="bg-white border border-blue-100 rounded-[1.5rem] p-5 shadow-sm">' +
        '<div class="flex items-center gap-2 mb-3"><span class="text-xl">' + flag + '</span>' +
        '<span class="text-[9px] font-black uppercase tracking-widest text-zinc-500">' +
        (country.length > 14 ? country.substring(0,12)+'…' : country) + '</span></div>' +
        '<p class="text-3xl font-black text-zinc-900 tracking-tighter">' + s.total + '</p>' +
        '<div class="flex gap-3 mt-2">' +
        '<span class="text-[9px] font-black text-amber-500">' + s.inProgress + ' IP</span>' +
        '<span class="text-[9px] font-black text-rose-500">' + s.notStarted + ' NS</span>' +
        '</div></div>';
    }).join('');

    const tiendaSet = [];
    data.rows.forEach(function(r) { if (tiendaSet.indexOf(r.tienda) === -1) tiendaSet.push(r.tienda); });
    tiendaSet.sort();
    const tiendaSel      = document.getElementById('rend-filter-tienda');
    const currentTienda  = tiendaSel ? tiendaSel.value : 'TODAS';
    if (tiendaSel) tiendaSel.innerHTML = '<option value="TODAS">Todas</option>' +
      tiendaSet.map(function(t) { return '<option value="' + t + '"' + (t===currentTienda?' selected':'') + '>' + t + '</option>'; }).join('');
  }

  window._rendAllRows  = data.rows;
  window._rendFiltered = data.rows;
  window._rendPage     = 0;
  filterRendTable();
}

function filterRendTable() {
  const search = (document.getElementById('rend-search')?.value || '').toLowerCase();
  window._rendFiltered = window._rendAllRows.filter(function(r) {
    if (!search) return true;
    return [r.actividad, r.tienda, r.storeDept, r.cargo, r.pais, r.codUsuario]
      .some(function(v) { return v.toLowerCase().includes(search); });
  });
  window._rendPage = 0;
  _renderRendTable();
}

function applyRendimientoFilters() { initRendimiento(); }

function rendPage(delta) {
  const pages = Math.ceil(window._rendFiltered.length / window._rendPageSize);
  window._rendPage = Math.max(0, Math.min(window._rendPage + delta, pages - 1));
  _renderRendTable();
}

function _renderRendTable() {
  const tbody  = document.getElementById('rend-tbody');
  const filtered = window._rendFiltered;
  const page   = window._rendPage;
  const size   = window._rendPageSize;
  const start  = page * size;
  const slice  = filtered.slice(start, start + size);
  const total  = filtered.length;
  const pages  = Math.ceil(total / size);

  const countEl = document.getElementById('rend-table-count');
  const pageEl  = document.getElementById('rend-page-info');
  const prevBtn = document.getElementById('rend-btn-prev');
  const nextBtn = document.getElementById('rend-btn-next');
  if (countEl) countEl.innerText = total.toLocaleString() + ' actividades';
  if (pageEl)  pageEl.innerText  = 'Página ' + (page+1) + ' de ' + (pages||1) + ' — ' + total.toLocaleString() + ' registros';
  if (prevBtn) prevBtn.disabled  = page === 0;
  if (nextBtn) nextBtn.disabled  = page >= pages - 1;

  if (!tbody) return;
  if (slice.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="px-6 py-8 text-center text-zinc-400 text-[11px]">Sin resultados.</td></tr>';
    return;
  }

  tbody.innerHTML = slice.map(function(r) {
    const flag        = REND_FLAGS[r.pais.toUpperCase()] || '';
    const statusClass = r.status.toUpperCase() === 'IN PROGRESS'
      ? 'bg-amber-50 text-amber-600 border-amber-200'
      : 'bg-rose-50 text-rose-600 border-rose-200';
    const rowId = 'rend-row-' + btoa(encodeURIComponent(r.codUsuario + '||' + r.actividad)).replace(/=/g,'');
    return '<tr id="' + rowId + '" class="hover:bg-blue-50/30 transition-colors">' +
      '<td class="px-4 py-3 text-center">' +
        '<button onclick="checkRendimiento(\'' + rowId + '\',\'' + r.codUsuario.replace(/'/g,"\\'") + '\',\'' + r.actividad.replace(/'/g,"\\'") + '\')" ' +
          'class="w-7 h-7 rounded-lg border-2 border-blue-200 hover:border-emerald-400 hover:bg-emerald-50 flex items-center justify-center transition-all group" title="Marcar como completado">' +
          '<span class="material-symbols-outlined text-[14px] text-zinc-300 group-hover:text-emerald-500">check</span>' +
        '</button>' +

function checkRendimiento(rowId, codUsuario, actividad) {
  const row = document.getElementById(rowId);
  if (!row) return;
  row.style.opacity = '0.4';
  row.style.pointerEvents = 'none';
  const btn = row.querySelector('button');
  if (btn) btn.innerHTML = '<span class="material-symbols-outlined text-[14px] text-blue-400 animate-spin">progress_activity</span>';

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        row.style.transition = 'opacity 0.4s, background 0.4s';
        row.style.background = '#f0fdf4';
        row.style.opacity    = '1';
        if (btn) btn.innerHTML = '<span class="material-symbols-outlined text-[14px] text-emerald-500">check_circle</span>';
        setTimeout(function() {
          row.style.opacity = '0';
          setTimeout(function() {
            window._rendAllRows  = window._rendAllRows.filter(function(r) {
              return !(r.codUsuario === codUsuario && r.actividad === actividad);
            });
            window._rendFiltered = window._rendFiltered.filter(function(r) {
              return !(r.codUsuario === codUsuario && r.actividad === actividad);
            });
            _renderRendTable();
          }, 400);
        }, 800);
      } else {
        row.style.opacity = '1';
        row.style.pointerEvents = 'auto';
        if (btn) btn.innerHTML = '<span class="material-symbols-outlined text-[14px] text-red-400">error</span>';
        alert('Error: ' + ((res && res.message) || 'No se pudo marcar como completado.'));
      }
    })
    .withFailureHandler(function(err) {
      row.style.opacity = '1';
      row.style.pointerEvents = 'auto';
      if (btn) btn.innerHTML = '<span class="material-symbols-outlined text-[14px] text-red-400">error</span>';
      alert('Error de conexión: ' + err.message);
    })
    .markRendimientoCompleted(codUsuario, actividad);
}

function exportRendimientoCSV() {
  const rows = window._rendFiltered;
  if (!rows || rows.length === 0) { alert('No hay datos para exportar.'); return; }
  const headers = ['País','Tienda','Store/Dept','Actividad','Status','Score','Cargo','F.Registro','Última Entrada','Cód.Usuario'];
  const csv = [headers.join(',')].concat(rows.map(function(r) {
    return [r.pais, r.tienda, '"'+r.storeDept+'"', '"'+r.actividad+'"', r.status, r.score,
            '"'+r.cargo+'"', r.fechaRegistro, r.ultimaEntrada, r.codUsuario].join(',');
  })).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'enocta_rendimiento_' + new Date().toISOString().substring(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

window._fullnessData = null;
window._fullnessSelectedStore = '';
window._fullnessDrillCache = {};
window._fullnessDrillSort = {};
window._fullnessDrillRenderState = {};

function initFullness() {
  const loading = document.getElementById('fullness-loading');
  const content = document.getElementById('fullness-content');
  const empty = document.getElementById('fullness-empty');
  if (loading) loading.classList.remove('hidden');
  if (content) content.classList.add('hidden');
  if (empty) empty.classList.add('hidden');

  const role = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();
  const activeStore = (sessionStorage.getItem('activeStore') || '').trim().toUpperCase();
  const switcher = document.getElementById('fullness-store-switcher');
  const select = document.getElementById('fullness-store-select');
  const showSwitcher = role === 'ADMIN' || role === 'RETAIL';

  if (switcher) switcher.classList.toggle('hidden', !showSwitcher);
  if (showSwitcher && select && select.options.length === 0) {
    loadStoresForCurrentUser(function(stores) {
      select.innerHTML = '';
      let matched = false;
      stores.forEach(function(store) {
        const opt = document.createElement('option');
        opt.value = opt.text = store;
        if (store.toUpperCase() === activeStore) {
          opt.selected = true;
          matched = true;
        }
        select.appendChild(opt);
      });
      if (!matched && stores.length > 0) {
        select.value = stores[0];
        window._fullnessSelectedStore = stores[0];
      } else {
        window._fullnessSelectedStore = select.value || activeStore;
      }
      loadFullnessData(window._fullnessSelectedStore);
    });
    return;
  }

  window._fullnessSelectedStore = showSwitcher && select ? (select.value || activeStore) : activeStore;
  loadFullnessData(window._fullnessSelectedStore);
}

function switchFullnessStore(store) {
  if (!isRetailStoreAllowed(store)) return alert('Esta ubicación no pertenece a tu país asignado.');
  window._fullnessSelectedStore = store;
  sessionStorage.setItem('activeStore', store);
  loadFullnessData(store);
}

function loadFullnessData(store, date) {
  const title = document.getElementById('fullness-title');
  if (title) title.innerText = 'Rendimiento — ' + (store || 'Tienda');
  window._fullnessDrillCache = {};
  window._fullnessDrillSort = {};
  window._fullnessDrillRenderState = {};

  google.script.run
    .withSuccessHandler(function(data) {
      window._fullnessData = data || {};
      renderFullnessData(data || {});
    })
    .withFailureHandler(function(err) {
      showFullnessEmpty('Error al cargar TEST_Fullness: ' + err.message);
      console.error('Fullness error:', err);
    })

}

function renderFullnessData(data) {
  const loading = document.getElementById('fullness-loading');
  if (loading) loading.classList.add('hidden');

  if (!data || !data.rows || data.rows.length === 0) {
    showFullnessEmpty(data && data.error ? data.error : 'No hay registros en TEST_Fullness para la tienda conectada.');
    return;
  }

  if (content) content.classList.remove('hidden');

  if (meta) meta.innerText = 'Fuente: ' + (data.sourceSheet || 'TEST_Fullness') + ' | Fecha: ' + (data.selectedDate || '—');

  setText('fullness-rayon-total', formatPct(stats.totalRayonOcc));
  setText('fullness-actual-total', formatPct(stats.totalActualOcc));
  setText('fullness-avg-occ', formatPct(stats.totalRayonOcc));

function toggleFullnessDrilldown(rowKey) {
  const row = document.getElementById('fullness-row-' + rowKey);

  if (!row || !drill) return;

  if (!drill.classList.contains('hidden')) {
    drill.classList.add('hidden');
    if (chevron) chevron.innerText = 'chevron_right';
    return;
  }

  if (chevron) chevron.innerText = 'expand_more';
  drill.classList.remove('hidden');
  drill.children[0].innerHTML = '<div class="py-5 text-center text-[10px] font-black uppercase tracking-widest text-zinc-400">Cargando detalle...</div>';

  const marker = row.querySelector('[data-store]');
  const store = marker?.dataset.store || window._fullnessSelectedStore || '';
  const group = marker?.dataset.group || '';
  const age = marker?.dataset.age || '';
  const cacheKey = [store, group, age].join('|');
  const domKey = buildFullnessDomKey(cacheKey);

  if (window._fullnessDrillCache[cacheKey]) {
    drill.children[0].innerHTML = renderFullnessDrilldown(window._fullnessDrillCache[cacheKey], group, age, domKey);
    return;

  google.script.run
    .withSuccessHandler(function(data) {

function buildFullnessHierarchy(rows) {
  const brandMap = new Map();
  rows.forEach(function(row) {
    const brandKey = String(row.merchBrandAgeGroup || '—').trim() || '—';
    const subKey = String(row.merchSubGroup || '—').trim() || '—';
    if (!brandMap.has(brandKey)) brandMap.set(brandKey, { label: brandKey, rows: [], subMap: new Map() });
    const brand = brandMap.get(brandKey);
    brand.rows.push(row);
    if (!isFullnessBrandTotalRow(row, brandKey) && !isFullnessBlankLabel(subKey)) {
      if (!brand.subMap.has(subKey)) brand.subMap.set(subKey, { label: subKey, rows: [] });
      brand.subMap.get(subKey).rows.push(row);
    }
  });

  return Array.from(brandMap.values()).map(function(brand) {
    const brandTotalRow = findFullnessBrandTotalRow(brand.rows, brand.label);
    const total = aggregateFullnessRows(brand.rows, brandTotalRow);
    total.label = brand.label;
    total.subGroups = Array.from(brand.subMap.values()).map(function(sub) {
      const subTotalRow = findFullnessSubTotalRow(sub.rows, sub.label);
      const subTotal = aggregateFullnessRows(sub.rows, subTotalRow);
      subTotal.label = sub.label;
      subTotal.categories = sub.rows
        .filter(function(row) {
          return !isFullnessBlankLabel(row.category) && !isFullnessSameLabel(row.category, sub.label);
        })
        .slice()
        .sort(_sortFullnessHierarchyRowsClient)
        .map(function(row) {
          return Object.assign({}, row, { label: row.category || '—' });
        });
      return subTotal;
    }).sort(_sortFullnessHierarchyTotalsClient);
    return total;
  }).sort(_sortFullnessHierarchyTotalsClient);
}

function aggregateFullnessRows(rows, preferredRow) {
  if (preferredRow) {
    return {
      count: rows.length,
      rayonOcc: preferredRow.rayonOcc,
      actualOcc: preferredRow.actualOcc,
      rayonStock: preferredRow.rayonStock,
      warehouseStock: preferredRow.warehouseStock,
      status: preferredRow.status
    };
  }

  const total = { count: rows.length, rayonOcc: '', actualOcc: '', rayonStock: 0, warehouseStock: 0, status: '' };
  let rayonOccSum = 0, rayonOccCount = 0, actualOccSum = 0, actualOccCount = 0;
  const statusCounts = {};
  rows.forEach(function(row) {
    const rayonOcc = parseFullnessSortNumber(row.rayonOcc);
    const actualOcc = parseFullnessSortNumber(row.actualOcc);
    const rayonStock = parseFullnessSortNumber(row.rayonStock);
    const warehouseStock = parseFullnessSortNumber(row.warehouseStock);
    if (rayonOcc !== null) { rayonOccSum += rayonOcc; rayonOccCount++; }
    if (actualOcc !== null) { actualOccSum += actualOcc; actualOccCount++; }
    if (rayonStock !== null) total.rayonStock += rayonStock;
    if (warehouseStock !== null) total.warehouseStock += warehouseStock;
    const status = String(row.status || '').trim();
    if (status) statusCounts[status] = (statusCounts[status] || 0) + 1;
  });
  total.rayonOcc = rayonOccCount ? rayonOccSum / rayonOccCount : '';
  total.actualOcc = actualOccCount ? actualOccSum / actualOccCount : '';
  total.status = pickFullnessStatus(statusCounts);
  return total;
}

function isFullnessSameLabel(a, b) {
  return String(a || '').trim().toUpperCase() === String(b || '').trim().toUpperCase();
}

function isFullnessBlankLabel(value) {
  const text = String(value || '').trim();
  return !text || text === '—' || text === '-';
}

function findFullnessBrandTotalRow(rows, brandLabel) {
  return rows.find(function(row) {
    return isFullnessSameLabel(row.merchBrandAgeGroup, brandLabel) &&
           isFullnessBlankLabel(row.merchSubGroup) &&
           isFullnessBlankLabel(row.category);
  }) || rows.find(function(row) {
    return isFullnessSameLabel(row.merchBrandAgeGroup, brandLabel) &&
           isFullnessSameLabel(row.merchSubGroup, brandLabel) &&
           isFullnessBlankLabel(row.category);
  }) || rows.find(function(row) {
    return isFullnessSameLabel(row.merchBrandAgeGroup, brandLabel) &&
           isFullnessSameLabel(row.merchSubGroup, brandLabel) &&
           isFullnessSameLabel(row.category, brandLabel);
  });
}

function findFullnessSubTotalRow(rows, subLabel) {
  return rows.find(function(row) {
    return isFullnessSameLabel(row.merchSubGroup, subLabel) &&
           isFullnessBlankLabel(row.category);
  }) || rows.find(function(row) {
    return isFullnessSameLabel(row.merchSubGroup, subLabel) &&
           isFullnessSameLabel(row.category, subLabel);
  });
}

function isFullnessBrandTotalRow(row, brandLabel) {
  return !!findFullnessBrandTotalRow([row], brandLabel);
}

function pickFullnessStatus(statusCounts) {
  const order = ['Empty-Available Stock', 'Empty-Unavailable Stock', 'Full Occupancy'];
  for (let i = 0; i < order.length; i++) {
    if (statusCounts[order[i]]) return order[i];
  }
  return Object.keys(statusCounts)[0] || '';
}

function _sortFullnessHierarchyTotalsClient(a, b) {
  const occA = parseFullnessSortNumber(a.rayonOcc);
  const occB = parseFullnessSortNumber(b.rayonOcc);
  if (occA !== null && occB !== null && occA !== occB) return occA - occB;
  return String(a.label || '').localeCompare(String(b.label || ''), undefined, { numeric: true, sensitivity: 'base' });
}

function _sortFullnessHierarchyRowsClient(a, b) {
  return String((a.category || '') + (a.status || '')).localeCompare(String((b.category || '') + (b.status || '')), undefined, { numeric: true, sensitivity: 'base' });
}

function renderFullnessDrillSortHeader(label, field, domKey, alignRight) {
  const sort = window._fullnessDrillSort[domKey] || {};
  const active = sort.field === field;
  const icon = active ? (sort.direction === 'desc' ? 'arrow_downward' : 'arrow_upward') : 'unfold_more';
  const activeClass = active ? ' text-[#1565C0]' : '';
  return '<th class="px-4 py-3' + (alignRight ? ' text-right' : '') + '">' +
    '<button type="button" onclick="sortFullnessDrilldown(\'' + safeAttr(domKey) + '\', \'' + safeAttr(field) + '\')" ' +
      'class="inline-flex items-center gap-1 uppercase font-black tracking-widest cursor-pointer select-none hover:text-[#1565C0] transition-colors' + activeClass + (alignRight ? ' justify-end w-full' : '') + '" ' +
      'title="Ordenar por ' + safeAttr(label) + '">' +
      '<span>' + safeText(label) + '</span>' +
      '<span class="material-symbols-outlined text-[13px] leading-none">' + icon + '</span>' +
    '</button>' +
  '</th>';
}

function sortFullnessDrilldown(domKey, field) {
  const current = window._fullnessDrillSort[domKey] || {};
  window._fullnessDrillSort[domKey] = {
    field: field,
    direction: current.field === field && current.direction === 'asc' ? 'desc' : 'asc'
  };

  const state = window._fullnessDrillRenderState[domKey];
  const container = document.getElementById('fullness-drill-content-' + domKey);
  if (!state || !container) return;
  container.outerHTML = renderFullnessDrilldown(state.data, state.group, state.age, domKey);
}

function sortFullnessDrillRows(rows, sort) {
  if (!sort || !sort.field) return rows;
  const direction = sort.direction === 'desc' ? -1 : 1;
  return rows.slice().sort(function(a, b) {
    return compareFullnessDrillValues(a[sort.field], b[sort.field]) * direction;
  });
}

function compareFullnessDrillValues(a, b) {
  const numA = parseFullnessSortNumber(a);
  const numB = parseFullnessSortNumber(b);
  const emptyA = isEmptyFullnessSortValue(a);
  const emptyB = isEmptyFullnessSortValue(b);
  if (emptyA && !emptyB) return 1;
  if (!emptyA && emptyB) return -1;
  if (numA !== null && numB !== null) return numA - numB;
  return String(a || '').toLowerCase().localeCompare(String(b || '').toLowerCase(), undefined, { numeric: true, sensitivity: 'base' });
}

function isEmptyFullnessSortValue(value) {
  const text = String(value || '').trim();
  return text === '' || text === '—' || text === '-';
}

function parseFullnessSortNumber(value) {
  if (value === null || value === undefined || isEmptyFullnessSortValue(value)) return null;
  const n = Number(String(value).replace(/,/g, '').replace('%', '').trim());
  return isNaN(n) ? null : n;
}

function buildFullnessDomKey(value) {
  return btoa(encodeURIComponent(String(value || ''))).replace(/=/g, '');
}

function hasUsefulFullnessMetricClient(row) {
  return isPositiveFullnessOccClient(row.rayonOcc) ||
         isPositiveFullnessOccClient(row.actualOcc);
}

function isPositiveFullnessOccClient(value) {
  const n = parseFullnessSortNumber(value);
  return n !== null && n > 0;
}

function showFullnessEmpty(message) {
  const loading = document.getElementById('fullness-loading');
  const content = document.getElementById('fullness-content');
  const empty = document.getElementById('fullness-empty');
  const msg = document.getElementById('fullness-empty-message');
  if (loading) loading.classList.add('hidden');
  if (content) content.classList.add('hidden');
  if (empty) empty.classList.remove('hidden');
  if (msg) msg.innerText = message;
}

function fullnessStatusClass(status) {
  const value = String(status || '').toUpperCase();
  if (value === 'FULL OCCUPANCY') return { badge: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' };
  if (value === 'EMPTY-AVAILABLE STOCK') return { badge: 'bg-rose-50 text-rose-600 border-rose-200', dot: 'bg-rose-500' };
  if (value === 'EMPTY-UNAVAILABLE STOCK') return { badge: 'bg-amber-50 text-amber-700 border-amber-200', dot: 'bg-amber-500' };
  return { badge: 'bg-zinc-50 text-zinc-600 border-zinc-200', dot: 'bg-zinc-400' };
}

function setText(id, value) {
  const el = document.getElementById(id);
  if (el) el.innerText = value;
}

function safeText(value) {
  return String(value || '—').replace(/[&<>"']/g, function(ch) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch];
  });
}

function safeAttr(value) {
  return String(value || '').replace(/[&<>"']/g, function(ch) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch];
  });
}

function formatPct(value) {
  if (value === '' || value === null || value === undefined) return '—';
  const n = Number(value);
  if (isNaN(n)) return safeText(value);
  return n.toFixed(n % 1 === 0 ? 0 : 1) + '%';
}

function formatFullnessNum(value) {
  if (value === '' || value === null || value === undefined) return '—';
  const n = Number(value);
  if (isNaN(n)) return safeText(value);
  return Math.round(n).toLocaleString();
}

function formatFullnessDecimal(value) {
  if (value === '' || value === null || value === undefined) return '—';
  const n = Number(value);
  if (isNaN(n)) return safeText(value);
  return n.toLocaleString(undefined, { maximumFractionDigits: 1 });
}

let _despData       = [];
let _activeDespacho = null;
let _pendingInvoice = null;
let _pendingStore   = null;
let _despSelectedStore = '';
let _despAdminMode = false;

function initDespachos() {
  const role = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();
  const store = sessionStorage.getItem('activeStore') || '';
  const isAdmin = role === 'ADMIN';
  if (isAdmin) ensureDespAdminDashboardDom();
  const nameEl = document.getElementById('despStoreName');
  const countryFilter = document.getElementById('despCountryFilter');
  const storeFilter = document.getElementById('despStoreFilter');
  const sel = document.getElementById('despSelector');
  if (!sel) return;

  hideAllDesp();
  _despData = [];
  _activeDespacho = null;
  _pendingInvoice = null;
  _pendingStore = null;
  _despSelectedStore = store;
  _despAdminMode = isAdmin;

  const standardHeader = document.getElementById('despStandardHeader');
  const adminDashboard = document.getElementById('despAdminDashboard');
  if (standardHeader) {
    standardHeader.classList.toggle('hidden', _despAdminMode);
    standardHeader.style.display = _despAdminMode ? 'none' : '';
  }
  if (adminDashboard) {
    adminDashboard.classList.toggle('hidden', !_despAdminMode);

  }

    if (nameEl) nameEl.textContent = 'REGIONAL';

    if (storeFilter) storeFilter.classList.remove('hidden');

      storeFilter.innerHTML = '<option value="__ALL__">Todas las tiendas</option>';
      storeFilter.value = '__ALL__';
    }
    populateDespAdminStoreProxy([]);
    loadDespachosForStore('__ALL__');
    return;
  }

  if (countryFilter) countryFilter.classList.add('hidden');
  if (storeFilter) storeFilter.classList.add('hidden');
  if (nameEl) nameEl.textContent = store;
  loadDespachosForStore(store);
}

        '<div class="rounded-[24px] bg-white border border-blue-50 shadow-sm p-6"><p class="text-[11px] font-black text-[#1565C0] uppercase tracking-[0.16em]">Contribución por unidades</p><h3 class="text-xl font-black text-zinc-900 uppercase tracking-tight mb-5">Season</h3><div id="despSeasonChart" class="min-h-[220px]"></div></div>' +
