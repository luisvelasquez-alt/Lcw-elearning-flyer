function onDespCountryChange() {
  const country = document.getElementById('despCountryFilter')?.value || '';
  const storeFilter = document.getElementById('despStoreFilter');
  const sel = document.getElementById('despSelector');
  const nameEl = document.getElementById('despStoreName');
  hideAllDesp();
  _despData = [];
  _activeDespacho = null;
  _despSelectedStore = '';
  if (nameEl) nameEl.textContent = country || 'REGIONAL';
  if (!storeFilter) return;
  if (!country) {
    storeFilter.innerHTML = '<option value="__ALL__">Todas las tiendas</option>';
    storeFilter.value = '__ALL__';
    populateDespAdminStoreProxy([]);
    loadDespachosForStore('__ALL__');
    return;
  }
  storeFilter.innerHTML = '<option value="__ALL__">Todas las tiendas</option><option value="" disabled>Cargando tiendas...</option>';
  storeFilter.value = '__ALL__';
  const storeProxy = document.getElementById('despAdminStoreProxy');
  if (storeProxy) {
    storeProxy.innerHTML = '<option value="__ALL__">Todas las tiendas</option>';
    storeProxy.value = '__ALL__';
  }
  loadDespachosForStore('__ALL__', country);

  google.script.run
    .withSuccessHandler(function(stores) {
      storeFilter.innerHTML = '<option value="__ALL__">Todas las tiendas</option>';
      populateDespAdminStoreProxy(stores || []);
      (stores || []).forEach(function(store) {
        const opt = document.createElement('option');
        opt.value = store;
        opt.text = store;
        storeFilter.appendChild(opt);
      });
      storeFilter.value = '__ALL__';
      if (!stores || stores.length === 0) showDespError('No hay tiendas activas para este país.');
    })
    .withFailureHandler(function(err) {
      const msg = (err && err.message) ? err.message : String(err);
      storeFilter.innerHTML = '<option value="">Error al cargar</option>';
      showDespError('Error al cargar tiendas: ' + msg);
    })
    .getStoreNamesByCountry(country);
}

function onDespStoreChange() {
  const store = document.getElementById('despStoreFilter')?.value || '';
  const country = document.getElementById('despCountryFilter')?.value || '';
  const nameEl = document.getElementById('despStoreName');
  const isAll = !store || store === '__ALL__';
  if (nameEl) nameEl.textContent = isAll ? (country || 'REGIONAL') : store;
  loadDespachosForStore(isAll ? '__ALL__' : store, isAll ? country : '');
}

function syncDespAdminCountry(country) {
  const hiddenCountry = document.getElementById('despCountryFilter');
  if (hiddenCountry) hiddenCountry.value = country || '';
  const storeProxy = document.getElementById('despAdminStoreProxy');
  if (storeProxy) {
    storeProxy.innerHTML = '<option value="__ALL__">Todas las tiendas</option>';
    storeProxy.value = '__ALL__';
  }
  onDespCountryChange();
}

function syncDespAdminStore(store) {
  const hiddenStore = document.getElementById('despStoreFilter');
  if (hiddenStore) hiddenStore.value = store || '__ALL__';
  onDespStoreChange();
}

function populateDespAdminStoreProxy(stores) {
  const proxy = document.getElementById('despAdminStoreProxy');
  if (!proxy) return;
  proxy.innerHTML = '<option value="__ALL__">Todas las tiendas</option>';
  (stores || []).forEach(function(store) {
    const opt = document.createElement('option');
    opt.value = store;
    opt.text = store;
    proxy.appendChild(opt);
  });
  proxy.value = '__ALL__';
}

function loadDespachosForStore(store, country) {
  const sel = document.getElementById('despSelector');
  if (!sel) return;
  hideAllDesp();
  _despData = [];
  _activeDespacho = null;
  _pendingStore = null;
  _despSelectedStore = store;
  sel.innerHTML = '<option value="">Cargando despachos...</option>';
  sel.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.error) {
        sel.innerHTML = '<option value="">Error al cargar</option>';
        sel.disabled = false;
        showDespError(result.error);
        return;
      }
      _despData = result.despachos || [];
      if (_despData.length === 0) {
        sel.innerHTML = '<option value="">Sin despachos disponibles</option>';
        sel.disabled = false;
        renderDespAdminDashboard();
        showDespEmpty();
        return;
      }
      sel.innerHTML = '<option value="">— Seleccione un despacho —</option>';
      var allOpt = document.createElement('option');
      allOpt.value = '__ALL_DESP__';
      allOpt.text = 'Todos los despachos';
      sel.appendChild(allOpt);
      sel.disabled = false;
      _despData.forEach(function(d) {
        var opt = document.createElement('option');
        opt.value = d.despacho;
        var stores = {};
        (d.invoices || []).forEach(function(inv) { if (inv.store) stores[inv.store] = true; });
        var storeCount = Object.keys(stores).length;
        opt.text  = 'Despacho ' + d.despacho + (storeCount > 1 ? ' · ' + storeCount + ' tiendas' : '');
        sel.appendChild(opt);
      });
      populateDespAdminDespachos();
      sel.value = '__ALL_DESP__';
      onDespChange();
    })
    .withFailureHandler(function(err) {
      var msg = (err && err.message) ? err.message : String(err);
      if (sel) sel.innerHTML = '<option value="">Error al cargar</option>';
      if (sel) sel.disabled = false;
      showDespError('Error al cargar despachos: ' + msg);
    })
    .getDespachos(store, country || '');
}

function onDespChange() {
  var val = document.getElementById('despSelector').value;
  hideAllDesp();
  if (!val) return;
  if (val === '__ALL_DESP__') {
    var allInvoices = [];
    (_despData || []).forEach(function(d) {
      (d.invoices || []).forEach(function(inv) {
        allInvoices.push(Object.assign({ despacho: d.despacho }, inv));
      });
    });
    _activeDespacho = { despacho: '__ALL_DESP__', invoices: allInvoices };
    if (!allInvoices.length) { showDespEmpty(); return; }
    if (_despAdminMode) {
      renderDespAdminDashboard();
      return;
    }
    renderDespSummary(allInvoices, true);
    renderDespDept(allInvoices, true);
    return;
  }
  _activeDespacho = null;
  for (var i = 0; i < _despData.length; i++) {
    if (_despData[i].despacho === val) { _activeDespacho = _despData[i]; break; }
  }
  if (!_activeDespacho || !_activeDespacho.invoices.length) { showDespEmpty(); return; }
  if (_despAdminMode) {
    renderDespAdminDashboard();
    return;
  }
  renderDespSummary(_activeDespacho.invoices, false);
  renderDespDept(_activeDespacho.invoices, false);
}

function populateDespAdminDespachos() {
  const adminSel = document.getElementById('despAdminDespFilter');
  if (!adminSel) return;
  adminSel.innerHTML = '<option value="__ALL_DESP__">Todos los despachos</option>';
  (_despData || []).forEach(function(d) {
    const opt = document.createElement('option');
    opt.value = d.despacho;
    opt.text = 'Despacho ' + d.despacho;
    adminSel.appendChild(opt);
  });
}

function getDespAdminInvoices() {
  const despacho = document.getElementById('despAdminDespFilter')?.value || '__ALL_DESP__';
  const status = document.getElementById('despStatusFilter')?.value || 'PENDIENTE';
  let rows = [];
  (_despData || []).forEach(function(d) {
    if (despacho !== '__ALL_DESP__' && d.despacho !== despacho) return;
    (d.invoices || []).forEach(function(inv) {
      const invStatus = String(inv.status || '').trim().toUpperCase();
      const isRec = invStatus === 'RECIBIDO';
      if (status === 'PENDIENTE' && isRec) return;
      if (status === 'RECIBIDO' && !isRec) return;
      rows.push(Object.assign({ despacho: d.despacho }, inv));
    });
  });
  return rows;
}

function renderDespAdminDashboard() {
  if (!_despAdminMode) return;
  hideAllDesp();
  const rows = getDespAdminInvoices();
  const despachos = {};
  rows.forEach(function(inv) { if (inv.despacho) despachos[inv.despacho] = true; });
  const totalDesp = Object.keys(despachos).length;
  const totalInv = rows.length;
  const totalUnits = rows.reduce((sum, inv) => sum + Number(inv.unidades || 0), 0);

function groupDespUnits(rows, key) {
  const totals = {};
  rows.forEach(function(inv) {
    (inv.depts || []).forEach(function(d) {
      const label = String(d[key] || 'N/A').trim() || 'N/A';
      totals[label] = (totals[label] || 0) + Number(d.quantity || 0);
    });
  });
  return Object.keys(totals).map(function(label) {
    return { label, value: totals[label] };
  }).sort(function(a, b) { return b.value - a.value; }).slice(0, 6);
}

function renderDespDonut(id, rows) {
  const el = document.getElementById(id);
  if (!el) return;
  const palette = ['#2563C0', '#13756B', '#F59E24', '#6D28D9', '#DC2626', '#1493A3'];
  const total = rows.reduce((sum, r) => sum + Number(r.value || 0), 0);
  if (!total) {
    el.innerHTML = '<div class="h-[220px] flex items-center justify-center text-[10px] font-black uppercase tracking-[0.16em] text-zinc-300">Sin datos</div>';
    return;
  }
  let start = 0;
  const stops = rows.map(function(r, idx) {
    const pct = (r.value / total) * 100;
    const part = palette[idx % palette.length] + ' ' + start.toFixed(2) + '% ' + (start + pct).toFixed(2) + '%';
    start += pct;
    return part;
  }).join(', ');
  const legend = rows.map(function(r, idx) {
    const pct = total ? (r.value / total) * 100 : 0;
    return '<div class="grid grid-cols-[16px_1fr_auto] items-center gap-2 text-sm font-black text-zinc-700">' +
      '<span class="h-2.5 w-2.5 rounded-full" style="background:' + palette[idx % palette.length] + '"></span>' +
      '<span>' + escDespH(r.label) + '</span><span>' + pct.toFixed(1) + '%</span></div>';
  }).join('');
  el.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-[220px_1fr] gap-8 items-center">' +
    '<div class="mx-auto h-[190px] w-[190px] rounded-full" style="background:conic-gradient(' + stops + ');"><div class="relative left-1/2 top-1/2 h-[92px] w-[92px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-white"></div></div>' +
    '<div class="space-y-3">' + legend + '</div></div>';
}

function openDespModal(invoiceId, store) {
  _pendingInvoice = invoiceId;
  _pendingStore = store || _despSelectedStore || sessionStorage.getItem('activeStore') || '';
  var label = document.getElementById('modalInvoiceLabel');
  if (label) label.textContent = 'Invoice ' + invoiceId + (_pendingStore ? ' · ' + _pendingStore : '');
  var today = new Date();
  var fechaInput = document.getElementById('modalFecha');
  if (fechaInput) fechaInput.value = today.toISOString().split('T')[0];
  var modal = document.getElementById('despModal');
  if (modal) { modal.style.removeProperty('display'); modal.style.display = 'flex'; }
}

function closeDespModal() {
  var modal = document.getElementById('despModal');
  if (modal) modal.style.display = 'none';
  _pendingInvoice = null;
  _pendingStore = null;
}

function confirmDespRecibido() {
  if (!_pendingInvoice) return;
  var rawFecha = document.getElementById('modalFecha').value;
  if (!rawFecha) { alert('Por favor selecciona una fecha de recepción.'); return; }
  var parts    = rawFecha.split('-');
  var fechaFmt = parts[2] + '-' + parts[1] + '-' + parts[0];
  var store    = _despSelectedStore || sessionStorage.getItem('activeStore') || '';
  if (_pendingStore) store = _pendingStore;
  var actionStore = store;
  var invoiceId = _pendingInvoice;
  closeDespModal();

  var loader = document.getElementById('loader');
  if (loader) loader.style.display = 'flex';

  google.script.run
    .withSuccessHandler(function(result) {
      if (loader) loader.style.display = 'none';
      if (result.error) { showDespError('Error al guardar: ' + result.error); return; }
      (_despData || []).forEach(function(desp) {
        (desp.invoices || []).forEach(function(inv) {
          if (inv.invoiceId === invoiceId && (!actionStore || inv.store === actionStore)) {
            inv.status = 'RECIBIDO';
            inv.fechaLlegada = fechaFmt;
          }
        });
      });
      if (_activeDespacho) {
        for (var i = 0; i < _activeDespacho.invoices.length; i++) {
          if (_activeDespacho.invoices[i].invoiceId === invoiceId && (!actionStore || _activeDespacho.invoices[i].store === actionStore)) {
            _activeDespacho.invoices[i].status       = 'RECIBIDO';
            _activeDespacho.invoices[i].fechaLlegada = fechaFmt;
            break;
          }
        }
        if (_despAdminMode) {
          renderDespAdminDashboard();
          return;
        }
        var showDespacho = _activeDespacho.despacho === '__ALL_DESP__';
        renderDespSummary(_activeDespacho.invoices, showDespacho);
      }
    })
    .withFailureHandler(function(err) {
      if (loader) loader.style.display = 'none';
      var msg = (err && err.message) ? err.message : String(err);
      showDespError('Error al guardar: ' + msg);
    })
    .markInvoiceRecibido(store, invoiceId, fechaFmt);
}

function escDespH(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escDespQ(s) {
  return String(s || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function initRetailStore() {
  const role  = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();

  const loading = document.getElementById('rs-loading');
  const content = document.getElementById('rs-content');
  const empty   = document.getElementById('rs-empty');
  if (loading) loading.classList.remove('hidden');
  if (content) content.classList.add('hidden');
  if (empty) empty.classList.add('hidden');
  rsPrepareUploadControls();

  if (role === 'ADMIN') {
    rsInitAdminStoreSelector(function() {
      rsLoadRetailStoreData();
    });
  } else {
    const switcher = document.getElementById('rs-admin-store-switcher');
    if (switcher) switcher.classList.add('hidden');
    rsLoadRetailStoreData();
  }
}

function rsInitAdminStoreSelector(callback) {
  var switcher = document.getElementById('rs-admin-store-switcher');
  var select = document.getElementById('rs-admin-store-select');
  if (!select) {
    if (callback) callback();
    return;
  }
  if (switcher) switcher.classList.remove('hidden');
  select.innerHTML = '<option value="">Cargando tiendas...</option>';

  google.script.run
    .withSuccessHandler(function(stores) {
      stores = stores || [];
      var active = (sessionStorage.getItem('activeStore') || '').trim().toUpperCase();
      var hasActive = stores.some(function(store) {
        return String(store || '').trim().toUpperCase() === active;
      });
      if (!hasActive && stores.length) {
        active = String(stores[0] || '').trim().toUpperCase();
        sessionStorage.setItem('activeStore', active);
      }
      select.innerHTML = stores.map(function(store) {
        var value = String(store || '').trim();
        return '<option value="' + escRs(value) + '"' + (value.toUpperCase() === active ? ' selected' : '') + '>' + escRs(value) + '</option>';
      }).join('');
      if (!stores.length) select.innerHTML = '<option value="">Sin tiendas activas</option>';
      if (callback) callback();
    })
    .withFailureHandler(function(err) {
      select.innerHTML = '<option value="">Error al cargar</option>';
      rsShowEmpty('Error al cargar tiendas: ' + ((err && err.message) || err));
    })
    .getActiveStoreNames();
}

function rsUploadReportFile() {
  const role  = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();
  const store = (sessionStorage.getItem('activeStore') || '').trim();
  var typeEl = document.getElementById('rs-upload-report-type');
  var dateEl = document.getElementById('rs-upload-report-date');
  var files = _rsUploadFiles && _rsUploadFiles.length ? _rsUploadFiles.slice() : (_rsUploadFile ? [_rsUploadFile] : []);

  if (!files.length) {
    rsSetUploadStatus('Selecciona uno o más archivos antes de subir.', true);
    return;
  }
  if (!store && role !== 'ADMIN') {
    rsSetUploadStatus('No se pudo identificar la tienda activa.', true);
    return;
  }

  rsSetUploadBusy(true);
  var results = [];

  function finishUploads() {
    rsSetUploadBusy(false);
    rsLoadUploadHistory();
    var ok = results.filter(function(r) { return r && r.success; }).length;
    var fail = results.length - ok;
    if (fail) {
      var lastError = results.slice().reverse().find(function(r) { return !r || !r.success; });
      rsSetUploadStatus(ok + ' archivo(s) cargados, ' + fail + ' con error. ' + ((lastError && lastError.message) || 'No se pudo subir el último archivo.'), true);
    } else {
      rsSetUploadStatus(ok + ' archivo(s) guardados. Cargando datos en Base de datos.', false);
      rsResetUploadInput();
    }
  }

  function uploadNext(index) {
    if (index >= files.length) {
      finishUploads();
      return;
    }
    var file = files[index];
    rsSetUploadStatus('Cargando datos en Base de datos · ' + (index + 1) + ' de ' + files.length, false, true);
    var reader = new FileReader();
    reader.onload = function(event) {
    var result = String(event.target.result || '');
    var base64 = result.indexOf(',') > -1 ? result.split(',')[1] : result;
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          results.push(res || { success: false, message: 'No se pudo subir el archivo.' });
          rsSetUploadStatus(((res && res.message) || 'No se pudo subir el archivo.') + ' · ' + file.name, true);
          uploadNext(index + 1);
          return;
        }
        results.push(res);
        uploadNext(index + 1);
      })
      .withFailureHandler(function(err) {
        results.push({ success: false, message: (err && err.message) || String(err || '') });
        rsSetUploadStatus('Error al subir ' + file.name + ': ' + ((err && err.message) || err), true);
        uploadNext(index + 1);
      })
      .uploadRetailStoreReport({
        store: store,
        role: role,
        reportType: typeEl ? typeEl.value : 'AUTO',
        reportDate: dateEl ? dateEl.value : '',
        fileName: file.name,
        mimeType: file.type || 'application/octet-stream',
        base64Data: base64
      });
    };
    reader.onerror = function() {
      results.push({ success: false, message: 'No se pudo leer el archivo seleccionado.' });
      rsSetUploadStatus('No se pudo leer ' + file.name + '.', true);
      uploadNext(index + 1);
    };
    reader.readAsDataURL(file);
  }

  uploadNext(0);
}

function rsLoadUploadHistory() {
  const role  = (sessionStorage.getItem('userRole') || '').trim().toUpperCase();
  const store = (sessionStorage.getItem('activeStore') || '').trim();
  var history = document.getElementById('rs-upload-history');
  if (!history) return;

  google.script.run
    .withSuccessHandler(function(rows) {
      if (!rows || !rows.length) {
        history.classList.add('hidden');
        history.innerHTML = '';
        return;
      }
      history.classList.remove('hidden');
      history.innerHTML = '<div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 text-[10px] font-black uppercase tracking-widest text-zinc-400">' +
        rows.slice(0, 3).map(function(row) {
          var statusColor = row.status === 'SYNC_REQUESTED' || row.status === 'SYNCED' ? 'text-emerald-600' : (row.status === 'ERROR' ? 'text-red-500' : 'text-amber-500');
          return '<a class="truncate hover:text-[#1565C0]" href="' + escRs(row.url) + '" target="_blank">' + escRs(row.reportType) + ' · ' + escRs(row.fileName) + '</a>' +
            '<span class="' + statusColor + ' shrink-0">' + escRs(row.status || 'GUARDADO') + '</span>';
        }).join('<span class="hidden sm:inline text-blue-100">|</span>') +
      '</div>';
    })
    .withFailureHandler(function() {
      history.classList.add('hidden');
    })
    .getRetailStoreUploadHistory(store, role);
}

function rsRecalcKpisFromRS01(rows) {
  var enBodega = 0, negativosRayon = 0;
  var uniqueSizeMap = {};
  (rows || []).forEach(function(row) {
    var wh = Number(row.warehouse || 0);
    var ry = Number(row.rayon || 0);
    enBodega += wh;
    if (ry < 0) negativosRayon += Math.abs(ry);
    if (wh > 0) {
      var key = [
        String(row.specialcode1 || '').trim().toUpperCase(),
        String(row.color || '').trim().toUpperCase()
      ].join('||');
      if (key !== '||') uniqueSizeMap[key] = (uniqueSizeMap[key] || 0) + wh;
    }
  });
  var tallasUnicas = 0, tallasUnicasUnidades = 0;
  Object.keys(uniqueSizeMap).forEach(function(key) {
    var qty = uniqueSizeMap[key] || 0;
    if (qty <= 3) { tallasUnicas++; tallasUnicasUnidades += qty; }
  });
  var set = function(id, val) { var el = document.getElementById(id); if (el) el.innerText = val; };
  set('rs-kpi-en-bodega', enBodega.toLocaleString());
  set('rs-kpi-negativos', negativosRayon.toLocaleString());
  set('rs-kpi-tallas-unicas', tallasUnicasUnidades.toLocaleString());
  var pct = enBodega > 0 ? (tallasUnicasUnidades / enBodega) * 100 : 0;
  set('rs-kpi-tallas-unicas-sub', pct.toFixed(1) + '% del warehouse · ' + tallasUnicas.toLocaleString() + ' Specialcode + Color');
}

function rsGetLastPiecesRows(metric) {
  metric = metric || 'warehouse';
  var lpSeason = (document.getElementById('rs-lp-season-filter') || {}).value || '';
  var lpDept = (document.getElementById('rs-lp-dept-filter') || {}).value || '';
  var groups = {};
  (_rs01Data || []).forEach(function(row) {
    var qty = rsGetStockMetricQty(row, metric);
    if (qty <= 0) return;
    if (lpSeason && rsResolveWarehouseGroup(row, 'season') !== lpSeason) return;
    if (lpDept) {
      var sg = String(row.merch_sub_group || '').trim().toUpperCase();
      if (sg.substring(0, 2) !== lpDept) return;
    }
    var code = String(row.specialcode1 || '').trim();
    var color = String(row.color || '').trim();
    if (!code && !color) return;
    var key = code.toUpperCase() + '||' + color.toUpperCase();
    if (!groups[key]) {
      groups[key] = {
        country: row.country || '',
        store_id: row.store_id || '',
        report_date: row.report_date || '',
        specialcode1: code,
        name: row.name || '',
        color: color,
        season: rsResolveWarehouseGroup(row, 'season'),
        merch_group: rsResolveWarehouseGroup(row, 'merch_group'),
        merch_sub_group: row.merch_sub_group || '',
        product_family: rsResolveWarehouseGroup(row, 'product_family'),
        warehouse: 0,
        metric: metric,
        sizes: {},
        last_acceptance_date: row.last_acceptance_date || '',
        location_quantity: []
      };
    }
    groups[key].warehouse += qty;
    var size = String(row.size || 'Sin talla').trim();
    groups[key].sizes[size] = (groups[key].sizes[size] || 0) + qty;
    if (row.location_quantity) groups[key].location_quantity.push(String(row.location_quantity).trim());
    if (!groups[key].last_acceptance_date && row.last_acceptance_date) groups[key].last_acceptance_date = row.last_acceptance_date;
  });

  return Object.keys(groups).map(function(key) {
    var item = groups[key];
    item.size_detail = Object.keys(item.sizes).sort().map(function(size) {
      return size + ': ' + item.sizes[size];
    }).join(' | ');
    item.location_detail = item.location_quantity.filter(Boolean).join(' | ');
    return item;
  }).filter(function(item) {
    return item.warehouse <= 3;
  }).sort(function(a, b) {
    return a.warehouse - b.warehouse || String(a.specialcode1).localeCompare(String(b.specialcode1));
  });
}

function rsRenderPieChart(rows) {
  var chart = document.getElementById('rs-pie-chart');
  var legend = document.getElementById('rs-pie-legend');
  if (!chart || !legend) return;

  var groups = {};
  (rows || []).forEach(function(r) {
    var group = String(r.top_group || 'N/A').trim() || 'N/A';
    groups[group] = (groups[group] || 0) + Number(r.warehouse_stock || 0);
  });

  var sorted = Object.keys(groups)
    .map(function(k) { return { label: k, value: groups[k] }; })
    .filter(function(x) { return x.value > 0; })
    .sort(function(a, b) { return b.value - a.value; })
    .slice(0, 8);

  var total = sorted.reduce(function(sum, x) { return sum + x.value; }, 0);
  if (!total) {
    chart.innerHTML = '<div class="h-full flex items-center justify-center text-[10px] font-black uppercase tracking-widest text-zinc-300">Sin datos</div>';
    legend.innerHTML = '';
    return;
  }

  var palette = ['#1565C0','#13756B','#F59E24','#6D28D9','#DC2626','#1493A3','#64748B','#0D47A1'];
  var start = 0;
  var stops = sorted.map(function(row, idx) {
    var pct = row.value / total * 100;
    var stop = palette[idx % palette.length] + ' ' + start.toFixed(2) + '% ' + (start + pct).toFixed(2) + '%';
    start += pct;
    return stop;
  }).join(', ');

  chart.innerHTML = '<div class="h-full flex items-center justify-center"><div class="h-40 w-40 rounded-full" style="background:conic-gradient(' + stops + ');"><div class="relative left-1/2 top-1/2 h-20 w-20 -translate-x-1/2 -translate-y-1/2 rounded-full bg-white"></div></div></div>';
  legend.innerHTML = sorted.map(function(row, idx) {
    var pct = total ? ((row.value / total) * 100).toFixed(1) : '0.0';
    return '<div class="flex items-center justify-between gap-3">' +
      '<div class="flex items-center gap-2 min-w-0">' +
        '<span class="shrink-0 w-3 h-3 rounded-full" style="background:' + palette[idx % palette.length] + '"></span>' +
        '<span class="text-[11px] font-black text-zinc-700 uppercase tracking-wide truncate">' + escRs(row.label) + '</span>' +
      '</div>' +
      '<span class="text-[11px] font-black text-zinc-400 shrink-0">' + row.value.toLocaleString() + ' · ' + pct + '%</span>' +

function rsRenderMovementPieChart(rows) {
  var chart = document.getElementById('rs-55-pie-chart');
  var legend = document.getElementById('rs-55-pie-legend');
  if (!chart || !legend) return;

  var groups = {};
  (rows || []).forEach(function(r) {
    var group = String(r.top_group || 'N/A').trim() || 'N/A';
    groups[group] = (groups[group] || 0) + Number(r.quantity || 0);
  });

  var sorted = Object.keys(groups)
    .map(function(k) { return { label: k, value: groups[k] }; })
    .filter(function(x) { return x.value > 0; })
    .sort(function(a, b) { return b.value - a.value; })
    .slice(0, 8);

  var total = sorted.reduce(function(sum, x) { return sum + x.value; }, 0);
  if (!total) {
    chart.innerHTML = '<div class="h-full flex items-center justify-center text-[10px] font-black uppercase tracking-widest text-zinc-300">Sin datos</div>';
    legend.innerHTML = '';
    return;
  }

  var palette = ['#1565C0','#13756B','#F59E24','#6D28D9','#DC2626','#1493A3','#64748B','#0D47A1'];
  var start = 0;
  var stops = sorted.map(function(row, idx) {
    var pct = row.value / total * 100;
    var stop = palette[idx % palette.length] + ' ' + start.toFixed(2) + '% ' + (start + pct).toFixed(2) + '%';
    start += pct;
    return stop;
  }).join(', ');

  chart.innerHTML = '<div class="h-full flex items-center justify-center"><div class="h-40 w-40 rounded-full" style="background:conic-gradient(' + stops + ');"><div class="relative left-1/2 top-1/2 h-20 w-20 -translate-x-1/2 -translate-y-1/2 rounded-full bg-white"></div></div></div>';
  legend.innerHTML = sorted.map(function(row, idx) {
    var pct = total ? ((row.value / total) * 100).toFixed(1) : '0.0';
    return '<div class="flex items-center justify-between gap-3">' +
      '<div class="flex items-center gap-2 min-w-0">' +
        '<span class="shrink-0 w-3 h-3 rounded-full" style="background:' + palette[idx % palette.length] + '"></span>' +
        '<span class="text-[11px] font-black text-zinc-700 uppercase tracking-wide truncate">' + escRs(row.label) + '</span>' +
      '</div>' +
      '<span class="text-[11px] font-black text-zinc-400 shrink-0">' + row.value.toLocaleString() + ' · ' + pct + '%</span>' +
    '</div>';
  }).join('');
}

function rsRenderRetailStoreWarehousePie(rows, field, chartId, legendId, metric) {
  var chart = document.getElementById(chartId);
  var legend = document.getElementById(legendId);
  if (!chart || !legend) return;
  metric = metric || 'warehouse';

  var groups = {};
  (rows || []).forEach(function(r) {
    var qty = rsGetStockMetricQty(r, metric);
    if (qty <= 0) return;
    var group = rsResolveWarehouseGroup(r, field);
    groups[group] = (groups[group] || 0) + qty;
  });

  var sorted = Object.keys(groups)
    .map(function(k) { return { label: k, value: groups[k] }; })
    .filter(function(x) { return x.value > 0; })
    .sort(function(a, b) { return b.value - a.value; })
    .slice(0, 8);

  var total = sorted.reduce(function(sum, x) { return sum + x.value; }, 0);
  if (!total) {
    chart.innerHTML = '<div class="h-full flex items-center justify-center text-[10px] font-black uppercase tracking-widest text-zinc-300">Sin datos</div>';
    legend.innerHTML = '';
    return;
  }

  var palette = ['#1565C0','#13756B','#F59E24','#6D28D9','#DC2626','#1493A3','#64748B','#0D47A1'];

  var legendHtml = sorted.map(function(row, idx) {
    var pct = total ? ((row.value / total) * 100).toFixed(1) : '0.0';
    return '<div class="flex items-start gap-2">' +
      '<span class="shrink-0 w-2.5 h-2.5 mt-0.5 rounded-full" style="background:' + palette[idx % palette.length] + '"></span>' +
      '<div class="min-w-0">' +
        '<div class="text-[10px] font-black text-zinc-700 uppercase tracking-[0.08em] leading-tight">' + escRs(row.label) + '</div>' +
        '<div class="text-[10px] font-black text-zinc-400">' + row.value.toLocaleString() + ' · ' + pct + '%</div>' +
      '</div>' +
    '</div>';
  }).join('');

  if (sorted.length === 1) {
    chart.innerHTML = '<div class="h-full flex items-center justify-center">' +
      '<div class="h-36 w-36 rounded-full flex flex-col items-center justify-center gap-0.5" style="background:' + palette[0] + '">' +
        '<span class="text-white font-black text-[10px] uppercase tracking-[0.12em] text-center px-2 leading-tight">' + escRs(sorted[0].label) + '</span>' +
        '<span class="text-white/80 font-black text-xl">100%</span>' +
      '</div>' +
    '</div>';
    legend.innerHTML = legendHtml;
    return;
  }

  var start = 0;
  var stops = sorted.map(function(row, idx) {
    var pct = row.value / total * 100;
    var stop = palette[idx % palette.length] + ' ' + start.toFixed(2) + '% ' + (start + pct).toFixed(2) + '%';
    start += pct;
    return stop;
  }).join(', ');

  chart.innerHTML = '<div class="h-full flex items-center justify-center"><div class="h-40 w-40 rounded-full" style="background:conic-gradient(' + stops + ');"><div class="relative left-1/2 top-1/2 h-20 w-20 -translate-x-1/2 -translate-y-1/2 rounded-full bg-white"></div></div></div>';
  legend.innerHTML = legendHtml;
}

function rsPopulateMerchSeasonFilter(rows) {
  var container = document.getElementById('rs-01-merch-season-filter');
  if (!container) return;
  var metric = rsGetReport1Metric();

  var seasons = {};
  (rows || []).forEach(function(row) {
    if (rsGetStockMetricQty(row, metric) <= 0) return;
    var season = rsResolveWarehouseGroup(row, 'season');
    seasons[season] = true;
  });

  var sorted = Object.keys(seasons).sort(function(a, b) {
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
  });

  var pills = [{ label: 'Todas', value: 'TODAS', checked: true }].concat(sorted.map(function(season) {
    return { label: season, value: season, checked: false };
  }));

  container.innerHTML = pills.map(function(item) {
    return '<label class="flex items-center gap-2 rounded-xl px-2.5 py-2 text-[10px] font-black uppercase tracking-widest text-zinc-600 hover:bg-blue-50 cursor-pointer select-none">' +
      '<input type="checkbox" class="rs-merch-season-check accent-[#1565C0]" value="' + escRs(item.value) + '"' + (item.checked ? ' checked' : '') + ' onchange="rsHandleMerchSeasonToggle(this)">' +
      '<span>' + escRs(item.label) + '</span>' +
    '</label>';
  }).join('');
  rsUpdateMerchSeasonLabel();
  if (!window._rsMerchSeasonDropdownBound) {
    window._rsMerchSeasonDropdownBound = true;
    document.addEventListener('click', function(event) {
      var menu = document.getElementById('rs-01-merch-season-filter');
      var button = event.target.closest && event.target.closest('[onclick="rsToggleMerchSeasonDropdown(event)"]');
      if (menu && !menu.contains(event.target) && !button) menu.classList.add('hidden');
    });
  }
}

function rsToggleMerchSeasonDropdown(event) {
  if (event) event.stopPropagation();
  var menu = document.getElementById('rs-01-merch-season-filter');
  if (menu) menu.classList.toggle('hidden');
}

function rsHandleMerchSeasonToggle(input) {
  var checks = Array.prototype.slice.call(document.querySelectorAll('.rs-merch-season-check'));
  var all = checks.find(function(check) { return check.value === 'TODAS'; });

  if (input && input.value === 'TODAS' && input.checked) {
    checks.forEach(function(check) {
      if (check.value !== 'TODAS') check.checked = false;
    });
  } else if (input && input.value !== 'TODAS' && input.checked && all) {
    all.checked = false;
  }

  var selectedSpecific = checks.filter(function(check) {
    return check.value !== 'TODAS' && check.checked;
  });
  if (!selectedSpecific.length && all) all.checked = true;

  rsUpdateMerchSeasonLabel();
  rsRenderMerchGroupBySeason();
}

function rsUpdateMerchSeasonLabel() {
  var label = document.getElementById('rs-01-merch-season-label');
  if (!label) return;
  var selected = rsGetSelectedMerchSeasons();
  if (!selected.length) {
    label.innerText = 'Season: Todas';
  } else if (selected.length === 1) {
    label.innerText = 'Season: ' + selected[0];
  } else {
    label.innerText = 'Season: ' + selected.length;
  }
}

function rsGetSelectedMerchSeasons() {
  return Array.prototype.slice.call(document.querySelectorAll('.rs-merch-season-check'))
    .filter(function(check) { return check.checked && check.value !== 'TODAS'; })
    .map(function(check) { return check.value; });
}

function rsRenderMerchGroupBySeason() {
  var metric = rsGetReport1Metric();
  var selected = rsGetSelectedMerchSeasons();
  var selectedMap = {};
  selected.forEach(function(season) { selectedMap[season] = true; });

  var rows = selected.length
    ? (_rs01Data || []).filter(function(row) {
        return rsGetStockMetricQty(row, metric) > 0 && !!selectedMap[rsResolveWarehouseGroup(row, 'season')];
      })
    : (_rs01Data || []).filter(function(row) {
        return rsGetStockMetricQty(row, metric) > 0;
      });

  rsRenderRetailStoreWarehousePie(rows, 'merch_group', 'rs-01-merch-pie-chart', 'rs-01-merch-pie-legend', metric);
}

function rsResolveWarehouseGroup(row, field) {
  var value = String(row && row[field] || '').trim();
  if (value) return value;

  if (field === 'season') {
    var code = String(row && row.specialcode1 || '').trim().toUpperCase();
    var seasonMatch = code.match(/^[A-Z][0-9]/);
    return seasonMatch ? seasonMatch[0] : 'N/A';
  }

  if (field === 'merch_group') {
    var subGroup = String(row && row.merch_sub_group || '').trim().toUpperCase();
    return subGroup.length >= 2 ? subGroup.slice(0, 2) : 'N/A';
  }

  if (field === 'product_family') {
    var pfRaw = String(row && row['product_family'] || '').trim().toUpperCase();
    if (pfRaw && pfRaw !== 'UNKNOWN') return pfRaw;
    var sg = String(row && row.merch_sub_group || '').trim().toUpperCase();
    if (_RS_SHOES_SG[sg]) return 'SHOES';
    if (_RS_ACC_SG[sg]) return 'ACCESSORIES';
    if (sg) return 'APPAREL';
    return 'UNKNOWN';
  }

  return 'N/A';
}

function rsDownloadRS41() {

  var store = (sessionStorage.getItem('activeStore') || 'tienda').trim();
  var today = new Date();
  var dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  var headers = ['País','Tienda','Fecha Reporte','Código','Nombre','Color','Talla','Top Group','Sub Group','Línea','Rayón Stock','Bodega Stock','Reservado','Stock Total','Ubicación'];
  var rows = _rs41Data.map(function(r) {
    return [r.country, r.store_id, r.report_date, r.specialcode1, r.name, r.color, r.size, r.top_group, r.merch_sub_group, r.line, r.rayon_stock, r.warehouse_stock, r.reserved_stock, r.total_stock, r.location_quantity]
      .map(function(v) {
        var s = v == null ? '' : String(v).trim();
        return s.indexOf(',') > -1 || s.indexOf('"') > -1 || s.indexOf('\n') > -1 ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
  });

  var csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'RS41_' + store + '_' + dateStr + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
