<div id="login-container" class="flex min-h-[calc(100vh-8rem)] flex-col items-center justify-center px-2 py-8 animate-in fade-in duration-700">
  <div class="w-full max-w-[42rem] bg-white rounded-[2.25rem] px-6 py-10 shadow-[0px_28px_70px_rgba(21,101,192,0.12)] border border-blue-100 md:px-16 md:py-14">

    <div class="text-center mb-12">
      <img src="https://i.imgur.com/D1KnLco.png" alt="LC Waikiki" class="h-[2.6rem] w-auto object-contain mx-auto mb-2 md:h-[3.25rem]">
      <h2 class="text-3xl font-black tracking-tighter text-on-surface uppercase leading-none">Acceso Seguro</h2>
      <p class="text-[12px] font-black text-zinc-400 uppercase tracking-[0.35em] mt-6">Retail Pro v3.0</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" class="space-y-8">
      <div class="group">
        <label class="block text-[12px] font-black uppercase tracking-[0.18em] text-secondary mb-3 group-focus-within:text-primary transition-colors">Seleccionar Tienda</label>
        <div class="relative">
          <select id="storeSelect" required class="w-full h-16 bg-surface-container-high border-none rounded-xl px-5 pr-14 font-black text-base text-on-surface focus:ring-2 focus:ring-primary/20 transition-all appearance-none cursor-pointer md:h-[4.875rem]">
            <option value="" disabled selected>Cargando tiendas...</option>
          </select>
          <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-zinc-400">
            <span class="material-symbols-outlined text-3xl">keyboard_arrow_down</span>
          </div>
        </div>
      </div>

      <div class="group">
        <label class="block text-[12px] font-black uppercase tracking-[0.18em] text-secondary mb-3 group-focus-within:text-primary transition-colors">Contraseña de Acceso</label>
        <div class="relative">
          <input id="passwordInput" type="password" required placeholder="••••••••"
            class="w-full h-16 bg-surface-container-high border-none rounded-xl px-5 pr-14 font-black text-base text-on-surface placeholder:text-zinc-500 focus:ring-2 focus:ring-primary/20 transition-all md:h-[4.875rem]">
          <div class="absolute inset-y-0 right-4 flex items-center text-zinc-400">
            <span class="material-symbols-outlined text-lg">key</span>
          </div>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="signature-gradient w-full h-16 text-white rounded-xl font-black uppercase tracking-[0.28em] text-[11px] shadow-[0px_18px_35px_rgba(21,101,192,0.25)] active:scale-[0.98] transition-all flex items-center justify-center gap-3 mt-10 md:h-[4.875rem] md:text-xs">
        AUTENTICAR SISTEMA
        <span class="material-symbols-outlined text-sm">verified_user</span>
      </button>
    </form>

    <div class="text-center mt-10 pt-8 border-t border-zinc-100">
      <button type="button" onclick="openManual()" class="inline-flex items-center gap-2 text-[11px] font-black uppercase tracking-[0.16em] text-zinc-400 hover:text-[#1565C0] transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-sm">menu_book</span>
        Ver Manual de Usuario
      </button>
    </div>
  </div>
</div>
