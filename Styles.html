<style>
  /* --- LCW RETAIL PRO DESIGN SYSTEM --- */
  :root {
    --primary: #1565C0;
    --primary-variant: #0D47A1;
    --primary-light: #1E88E5;
    --surface: #F4F7FB;
    --on-surface: #1A1C2E;
    --secondary: #607D8B;
  }

  body {
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .signature-gradient {
    background: linear-gradient(135deg, #1565C0 0%, #0D47A1 100%);
    transition: all 0.3s ease;
  }

  .signature-gradient:hover {
    filter: brightness(1.1);
    box-shadow: 0 10px 20px rgba(21, 101, 192, 0.25);
  }

  .bg-surface-container-lowest { background-color: #FFFFFF; }
  .bg-surface-container-high   { background-color: #EEF2F8; }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }

  #app-content {
    transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  table { border-spacing: 0; width: 100%; }
  tr:last-child td { border-bottom: none; }

  input:focus, select:focus, textarea:focus {
    outline: none !important;
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12) !important;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #f1f4f8; }
  ::-webkit-scrollbar-thumb { background: #b0bec5; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #78909c; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeIn 0.5s ease-out forwards; }

  @media print {
    header, nav, button { display: none !important; }
    main { padding-top: 0 !important; }
  }

  .budget-card {
    background: #ffffff;
    border: 1px solid #e3eaf4;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .budget-badge {
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background-color: #e8f0fe;
    color: #1565C0;
  }

  .pulse-goal { animation: goal-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  @keyframes goal-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }

  .status-success { color: #10b981; background-color: #ecfdf5; }
  .status-warning { color: #f59e0b; background-color: #fffbeb; }
  .status-danger  { color: #ef4444; background-color: #fef2f2; }

  .loading-active {
    filter: blur(4px);
    pointer-events: none;
    transition: all 0.3s ease;
  }

  #loader {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
  }

  .country-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    border-radius: 9999px;
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: #e8f0fe;
    color: #1565C0;
  }
  .admin-sort-header {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    width: 100%;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .admin-sort-header:hover,
  .admin-sort-header.is-active {
    color: #1565C0;
  }
  .admin-sort-icon {
    min-width: 8px;
    font-size: 9px;
    line-height: 1;
  }
  .drag-over {
    border-color: #1565C0 !important;
    background: #e8f0fe !important;
    transform: scale(1.01);
    transition: all 0.15s ease;
  }
  .drag-over #uploadIcon { color: #1565C0 !important; }
  .drag-over #uploadText { color: #1565C0 !important; }
</style>

<script id="tailwind-config">
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          primary:  '#1565C0',
          secondary: '#607D8B',
          surface:  '#F4F7FB',
          'on-surface': '#1A1C2E',
          'surface-container-low':    '#EDF1F7',
          'surface-container-lowest': '#FFFFFF',
          'surface-container-high':   '#E4EBF5',
        },
        fontFamily: { body: ['Inter', 'sans-serif'] },
      }
    }
  }
</script>
